<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Plan look</title>
  <!--
    PROTOTYPE — throwaway UI for issue #2.
    Round 2+3 spec: timeline rail + Pack & prep at bottom, full page scroll (nothing sticky).
    New variants: tl-accordion | tl-tabs | tl-cards
    Legacy variants: timeline | agenda | checklist
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --proto-bar-bg: #1a1a1f;
      --proto-bar-fg: #f4f4f6;
      --proto-bar-muted: #8b8b96;
    }

    body { min-height: 100dvh; padding-bottom: 5rem; }

    .proto-banner {
      background: #fef3c7;
      color: #92400e;
      font: 600 0.7rem/1 "Outfit", system-ui, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid #fcd34d;
    }

    .plan-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      align-items: baseline;
    }
    .plan-date { font-weight: 600; }
    .plan-bounds, .plan-weather { opacity: 0.72; font-size: 0.92em; }

    .checklist { list-style: none; }
    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.35rem 0;
      font-size: 0.92em;
    }
    .checklist input[type="checkbox"] {
      margin-top: 0.12rem;
      width: 1.05rem;
      height: 1.05rem;
      accent-color: #3d5a45;
      flex-shrink: 0;
    }
    .checklist label { cursor: pointer; }
    .checklist input:checked + label { text-decoration: line-through; opacity: 0.5; }

    /* ── Timeline + bottom prep (shared base) ── */
    .v-tl-base {
      --bg: #f7f3ed;
      --rail: #c4b5a0;
      --ink: #2c2419;
      --anchor: #3d5a45;
      --anchor-bg: #e8f0ea;
      --flex: #6b5344;
      --flex-bg: #f0ebe4;
      --prep-bg: #fff;
      --prep-border: #ddd5c8;
      background: var(--bg);
      color: var(--ink);
      font-family: "Outfit", system-ui, sans-serif;
      min-height: calc(100dvh - 2rem);
    }
    .v-tl-base .shell {
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    @media (min-width: 768px) {
      .v-tl-base .shell { max-width: 36rem; padding: 2rem 1.5rem 3rem; }
    }
    .v-tl-base .plan-header { margin-bottom: 1.75rem; font-size: 0.95rem; }
    .v-tl-base .plan-date {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.65rem;
      font-weight: 400;
      width: 100%;
    }
    .v-tl-base .rail-wrap {
      position: relative;
      padding-left: 3.25rem;
      margin-bottom: 2rem;
    }
    .v-tl-base .rail-wrap::before {
      content: "";
      position: absolute;
      left: 1.1rem;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(var(--rail), transparent 98%);
    }
    .v-tl-base .block {
      position: relative;
      margin-bottom: 0.35rem;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      border-left: 3px solid transparent;
    }
    .v-tl-base .block.anchor {
      background: var(--anchor-bg);
      border-left-color: var(--anchor);
    }
    .v-tl-base .block.flex {
      background: var(--flex-bg);
      border-left-color: var(--flex);
      border-left-style: dashed;
    }
    .v-tl-base .block.gap-filler {
      background: transparent;
      border: none;
      border-left: 1px dashed rgba(0,0,0,0.12);
      font-size: 0.68rem;
      padding: 0.25rem 0.85rem;
      color: var(--rail);
      display: flex;
      align-items: center;
      min-height: unset !important;
    }
    .v-tl-base .time-tag {
      position: absolute;
      left: -3.25rem;
      width: 2.75rem;
      text-align: right;
      font-family: "DM Mono", monospace;
      font-size: 0.72rem;
      color: var(--rail);
      top: 0.7rem;
    }
    .v-tl-base .block-title { font-weight: 600; font-size: 0.95rem; }
    .v-tl-base .block-range {
      font-family: "DM Mono", monospace;
      font-size: 0.72rem;
      opacity: 0.55;
      margin-top: 0.15rem;
    }
    .v-tl-base .bounds-cap {
      font-family: "DM Mono", monospace;
      font-size: 0.72rem;
      color: var(--rail);
      padding: 0.5rem 0;
      text-align: center;
    }
    .v-tl-base .prep-section {
      border-top: 2px solid var(--prep-border);
      padding-top: 1.25rem;
    }
    .v-tl-base .prep-heading {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--rail);
      margin-bottom: 0.85rem;
    }
    .v-tl-base .prep-done {
      margin-top: 1rem;
      border-top: 1px dashed var(--prep-border);
      padding-top: 0.75rem;
    }
    .v-tl-base .prep-done summary {
      font-size: 0.75rem;
      color: var(--rail);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .v-tl-base .prep-done summary::-webkit-details-marker { display: none; }
    .v-tl-base .prep-done summary::before { content: "▸"; font-size: 0.65rem; }
    .v-tl-base .prep-done[open] summary::before { content: "▾"; }
    .v-tl-base .done-list { margin-top: 0.65rem; opacity: 0.55; }

    /* Prep: vertical accordion */
    .v-tl-accordion .prep-bundle {
      background: var(--prep-bg);
      border: 1px solid var(--prep-border);
      border-radius: 10px;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }
    .v-tl-accordion .prep-bundle summary {
      padding: 0.85rem 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .v-tl-accordion .prep-bundle summary::-webkit-details-marker { display: none; }
    .v-tl-accordion .prep-bundle summary::after {
      content: "+";
      font-family: "DM Mono", monospace;
      font-size: 0.85rem;
      color: var(--rail);
      font-weight: 400;
    }
    .v-tl-accordion .prep-bundle[open] summary::after { content: "−"; }
    .v-tl-accordion .prep-bundle .checklist {
      padding: 0 1rem 0.85rem;
      border-top: 1px solid #f0ebe4;
    }
    .v-tl-accordion .bundle-sub {
      font-weight: 400;
      font-size: 0.78rem;
      color: var(--rail);
      margin-left: 0.35rem;
    }
    .v-tl-accordion .bundle-count {
      font-family: "DM Mono", monospace;
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--rail);
    }

    /* Prep: segmented tabs */
    .v-tl-tabs .tab-bar {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }
    .v-tl-tabs .tab-btn {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--prep-border);
      background: var(--prep-bg);
      color: var(--ink);
      cursor: pointer;
    }
    .v-tl-tabs .tab-btn[aria-selected="true"] {
      background: var(--anchor);
      border-color: var(--anchor);
      color: #fff;
    }
    .v-tl-tabs .tab-panel {
      display: none;
      background: var(--prep-bg);
      border: 1px solid var(--prep-border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }
    .v-tl-tabs .tab-panel.active { display: block; }
    .v-tl-tabs .panel-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.15rem;
    }
    .v-tl-tabs .panel-sub {
      font-size: 0.78rem;
      color: var(--rail);
      margin-bottom: 0.65rem;
    }

    /* Prep: expandable cards */
    .v-tl-cards .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.55rem;
    }
    @media (min-width: 768px) {
      .v-tl-cards .card-grid { grid-template-columns: 1fr 1fr; }
    }
    .v-tl-cards .prep-card {
      background: var(--prep-bg);
      border: 1px solid var(--prep-border);
      border-radius: 12px;
      overflow: hidden;
    }
    .v-tl-cards .prep-card summary {
      padding: 0.85rem 0.95rem;
      cursor: pointer;
      list-style: none;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .v-tl-cards .prep-card summary::-webkit-details-marker { display: none; }
    .v-tl-cards .card-sub {
      display: block;
      font-weight: 400;
      font-size: 0.72rem;
      color: var(--rail);
      margin-top: 0.2rem;
    }
    .v-tl-cards .prep-card .checklist {
      padding: 0 0.95rem 0.85rem;
      border-top: 1px solid #f0ebe4;
    }
    .v-tl-cards .prep-card.is-done {
      opacity: 0.45;
      grid-column: 1 / -1;
    }

    /* ── Legacy variants (round 1) ── */
    .badge-anchor, .badge-flex {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
    }
    .badge-anchor { background: rgba(0,0,0,0.08); }
    .badge-flex { background: rgba(0,0,0,0.04); border: 1px dashed rgba(0,0,0,0.18); }

    .v-timeline {
      --bg: #f7f3ed; --rail: #c4b5a0; --ink: #2c2419;
      --anchor: #3d5a45; --anchor-bg: #e8f0ea; --flex: #6b5344; --flex-bg: #f0ebe4;
      background: var(--bg); color: var(--ink);
      font-family: "Outfit", system-ui, sans-serif;
      min-height: calc(100dvh - 2rem);
    }
    .v-timeline .shell { max-width: 28rem; margin: 0 auto; padding: 1.5rem 1.25rem 2rem; }
    .v-timeline .plan-meta { margin-bottom: 1.75rem; font-size: 0.95rem; }
    .v-timeline .plan-date { font-family: "Instrument Serif", Georgia, serif; font-size: 1.65rem; font-weight: 400; width: 100%; }
    .v-timeline .rail-wrap { position: relative; padding-left: 3.25rem; }
    .v-timeline .rail-wrap::before {
      content: ""; position: absolute; left: 1.1rem; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(var(--rail), transparent 98%);
    }
    .v-timeline .block { position: relative; margin-bottom: 0.35rem; border-radius: 8px; padding: 0.65rem 0.85rem; border-left: 3px solid transparent; }
    .v-timeline .block.anchor { background: var(--anchor-bg); border-left-color: var(--anchor); }
    .v-timeline .block.flex { background: var(--flex-bg); border-left-color: var(--flex); }
    .v-timeline .block.gap-filler { background: transparent; border: 1px dashed rgba(0,0,0,0.06); opacity: 0.5; font-size: 0.75rem; padding: 0.35rem 0.85rem; color: var(--rail); }
    .v-timeline .time-tag { position: absolute; left: -3.25rem; width: 2.75rem; text-align: right; font-family: "DM Mono", monospace; font-size: 0.72rem; color: var(--rail); top: 0.7rem; }
    .v-timeline .block-title { font-weight: 600; font-size: 0.95rem; }
    .v-timeline .block-range { font-family: "DM Mono", monospace; font-size: 0.72rem; opacity: 0.55; margin-top: 0.15rem; }
    .v-timeline .checklist { color: var(--anchor); margin-top: 0.6rem; }
    .v-timeline .bounds-cap { font-family: "DM Mono", monospace; font-size: 0.72rem; color: var(--rail); padding: 0.5rem 0; text-align: center; }

    .v-agenda {
      --bg: #fafafa; --ink: #111; --rule: #ddd; --anchor-bar: #111; --flex-bar: #888;
      background: var(--bg); color: var(--ink); font-family: "DM Mono", ui-monospace, monospace;
      min-height: calc(100dvh - 2rem);
    }
    .v-agenda .sheet { max-width: 26rem; margin: 0 auto; padding: 1rem 0.85rem 2rem; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); min-height: calc(100dvh - 2rem); background: #fff; box-shadow: 0 0 0 1px var(--rule); }
    .v-agenda header { border-bottom: 2px solid var(--ink); padding-bottom: 0.65rem; margin-bottom: 0.5rem; }
    .v-agenda .plan-date { font-size: 0.85rem; font-weight: 500; }
    .v-agenda .plan-meta { font-size: 0.68rem; margin-top: 0.35rem; gap: 0.75rem; }
    .v-agenda .bounds-row { display: flex; justify-content: space-between; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.4rem 0; border-bottom: 1px solid var(--rule); color: #666; }
    .v-agenda table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
    .v-agenda th { text-align: left; font-weight: 500; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.12em; color: #666; padding: 0.45rem 0.25rem; border-bottom: 1px solid var(--rule); }
    .v-agenda td { padding: 0.35rem 0.25rem; vertical-align: top; border-bottom: 1px solid #eee; }
    .v-agenda tr.anchor td:first-child { border-left: 3px solid var(--anchor-bar); padding-left: 0.4rem; }
    .v-agenda tr.flex td:first-child { border-left: 3px solid var(--flex-bar); padding-left: 0.4rem; }
    .v-agenda .col-time { width: 4.5rem; white-space: nowrap; color: #444; }
    .v-agenda .col-dur { width: 2.5rem; text-align: right; color: #888; }
    .v-agenda .col-kind { width: 3rem; font-size: 0.58rem; text-transform: uppercase; color: #999; }
    .v-agenda .item-name { font-weight: 500; }
    .v-agenda .checklist { margin-top: 0.35rem; font-size: 0.65rem; color: #555; }

    .v-checklist {
      --bg: #eef1f6; --card: #fff; --ink: #1e293b; --accent: #2563eb;
      background: var(--bg); color: var(--ink); font-family: "Outfit", system-ui, sans-serif;
      min-height: calc(100dvh - 2rem);
    }
    .v-checklist .board { max-width: 30rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    .v-checklist .hero { background: var(--card); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(15,23,42,0.06); }
    .v-checklist .plan-date { font-size: 1.35rem; font-weight: 600; }
    .v-checklist .plan-meta { margin-top: 0.5rem; font-size: 0.88rem; color: #64748b; }
    .v-checklist .section-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin: 1.25rem 0 0.65rem; }
    .v-checklist .bundle { background: var(--card); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.65rem; box-shadow: 0 1px 3px rgba(15,23,42,0.05); }
    .v-checklist .bundle-head { display: flex; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.5rem; }
    .v-checklist .bundle-title { font-weight: 600; }
    .v-checklist .bundle-when { font-family: "DM Mono", monospace; font-size: 0.72rem; color: #64748b; }
    .v-checklist .checklist li { background: #f8fafc; border-radius: 8px; padding: 0.55rem 0.65rem; margin-bottom: 0.35rem; }
    .v-checklist .plain-row { background: var(--card); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.45rem; display: flex; justify-content: space-between; font-size: 0.92rem; }
    .v-checklist .plain-row .when { font-family: "DM Mono", monospace; font-size: 0.72rem; color: #94a3b8; }

    .proto-switcher {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 200;
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--proto-bar-bg); color: var(--proto-bar-fg);
      border-radius: 999px; padding: 0.45rem 0.65rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.28);
      font-family: "Outfit", system-ui, sans-serif; font-size: 0.82rem;
    }
    .proto-switcher button {
      background: rgba(255,255,255,0.12); border: none; color: inherit;
      width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer;
      font-size: 1rem; display: grid; place-items: center;
    }
    .proto-switcher button:hover { background: rgba(255,255,255,0.22); }
    .proto-switcher .label { min-width: 12rem; text-align: center; }
    .proto-switcher .label strong { display: block; font-weight: 600; font-size: 0.78rem; }
    .proto-switcher .label span { font-size: 0.68rem; color: var(--proto-bar-muted); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="proto-banner">Prototype — full scroll, no sticky · issue #2</div>
  <main id="app"></main>

  <nav class="proto-switcher" aria-label="Prototype variant switcher">
    <button type="button" id="prev-variant" aria-label="Previous variant">←</button>
    <div class="label" id="variant-label"></div>
    <button type="button" id="next-variant" aria-label="Next variant">→</button>
  </nav>

  <script>
    const PLAN = {
      date: "Thursday, 13 August 2026",
      dayBounds: { wake: "06:30", sleep: "23:00" },
      weather: "18° / 24° · partly cloudy",
      items: [
        { id: "wake", kind: "anchor", start: "06:30", end: "07:15", title: "Wake + breakfast", checklistId: "morning-out" },
        { id: "deep", kind: "flex", start: "07:15", end: "08:00", title: "Deep work", durationMin: 45 },
        { id: "standup", kind: "anchor", start: "09:00", end: "09:45", title: "Team standup" },
        { id: "project", kind: "flex", start: "09:45", end: "12:00", title: "Project block", durationMin: 135 },
        { id: "lunch", kind: "anchor", start: "12:30", end: "13:15", title: "Lunch" },
        { id: "admin", kind: "flex", start: "13:30", end: "14:30", title: "Admin + email", durationMin: 60 },
        { id: "gym", kind: "anchor", start: "18:00", end: "19:30", title: "Gym", checklistId: "gym-bag" },
        { id: "sauna", kind: "flex", start: "20:00", end: "20:30", title: "Sauna", durationMin: 30 },
        { id: "wind", kind: "anchor", start: "22:30", end: "23:00", title: "Wind-down" },
      ],
      checklists: {
        "morning-out": { name: "Before leaving", items: ["Keys", "Wallet", "Umbrella"] },
        "gym-bag": { name: "Gym bag", items: ["Water bottle", "Towel", "Lock", "Headphones"] },
      },
    };

    const VARIANTS = [
      { key: "tl-accordion", name: "Timeline + accordion prep", render: renderTlAccordion },
      { key: "tl-tabs", name: "Timeline + tab prep", render: renderTlTabs },
      { key: "tl-cards", name: "Timeline + card prep", render: renderTlCards },
      { key: "timeline", name: "Day strip (legacy)", render: renderTimelineLegacy },
      { key: "agenda", name: "Agenda sheet (legacy)", render: renderAgenda },
      { key: "checklist", name: "Morning board (legacy)", render: renderChecklist },
    ];

    const STORAGE_PREFIX = "plan-proto-" + PLAN.date.replace(/\s/g, "-") + "-";

    function parseTime(t) {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function formatDuration(min) {
      if (min < 60) return min + "m";
      const h = Math.floor(min / 60);
      const r = min % 60;
      return r ? h + "h" + r : h + "h";
    }

    function storageKey(itemId, checklistId, rowIndex) {
      return STORAGE_PREFIX + itemId + "-" + checklistId + "-" + rowIndex;
    }

    function isChecked(itemId, checklistId, rowIndex) {
      return localStorage.getItem(storageKey(itemId, checklistId, rowIndex)) === "1";
    }

    function setChecked(itemId, checklistId, rowIndex, checked) {
      const k = storageKey(itemId, checklistId, rowIndex);
      if (checked) localStorage.setItem(k, "1");
      else localStorage.removeItem(k);
    }

    function bundleProgress(item) {
      const cl = PLAN.checklists[item.checklistId];
      if (!cl) return { done: 0, total: 0, complete: true };
      let done = 0;
      cl.items.forEach((_, i) => { if (isChecked(item.id, item.checklistId, i)) done++; });
      return { done, total: cl.items.length, complete: done === cl.items.length };
    }

    function checklistRowsHtml(item, prefix) {
      const cl = PLAN.checklists[item.checklistId];
      if (!cl) return "";
      const rows = cl.items.map((label, i) => {
        const cid = prefix + item.id + "-" + i;
        const checked = isChecked(item.id, item.checklistId, i) ? " checked" : "";
        return `<li><input type="checkbox" id="${cid}" data-item="${item.id}" data-cl="${item.checklistId}" data-idx="${i}"${checked}><label for="${cid}">${label}</label></li>`;
      }).join("");
      return `<ul class="checklist" data-bundle="${item.id}">${rows}</ul>`;
    }

    function buildTimelineRail(includeChecklists = false) {
      const wake = parseTime(PLAN.dayBounds.wake);
      const sleep = parseTime(PLAN.dayBounds.sleep);
      const total = sleep - wake;
      let blocks = "";
      let cursor = wake;

      for (const item of PLAN.items) {
        const start = parseTime(item.start);
        const end = parseTime(item.end);
        if (start > cursor) {
          const gapMin = start - cursor;
          const h = Math.max(20, (gapMin / total) * 420);
          blocks += `<div class="block gap-filler" style="min-height:${h}px">Gap · ${formatDuration(gapMin)}</div>`;
        }
        const dur = end - start;
        const h = Math.max(52, (dur / total) * 420);
        const cl = includeChecklists && item.checklistId ? checklistRowsHtml(item, "tl-") : "";
        blocks += `
          <div class="block ${item.kind}" style="min-height:${h}px" data-item-id="${item.id}">
            <span class="time-tag">${item.start}</span>
            <div class="block-title">${item.title}</div>
            <div class="block-range">${item.start}–${item.end}</div>
            ${cl}
          </div>`;
        cursor = end;
      }
      return blocks;
    }

    function planHeaderHtml() {
      return `
        <header class="plan-header">
          <div class="plan-meta">
            <div class="plan-date">${PLAN.date}</div>
            <div class="plan-bounds">Wake ${PLAN.dayBounds.wake} · Sleep ${PLAN.dayBounds.sleep}</div>
            <div class="plan-weather">${PLAN.weather}</div>
          </div>
        </header>`;
    }

    function prepItems() {
      return PLAN.items.filter(i => i.checklistId);
    }

    function bundleLabel(item) {
      const cl = PLAN.checklists[item.checklistId];
      return `${item.title}<span class="bundle-sub">· ${cl.name}</span>`;
    }

    function wireCheckboxes(root, rerender) {
      root.querySelectorAll('.checklist input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          setChecked(cb.dataset.item, cb.dataset.cl, Number(cb.dataset.idx), cb.checked);
          rerender();
        });
      });
    }

    function wireAccordion(root) {
      root.querySelectorAll(".v-tl-accordion .prep-bundle").forEach(el => {
        el.addEventListener("toggle", () => {
          if (!el.open) return;
          root.querySelectorAll(".v-tl-accordion .prep-bundle").forEach(other => {
            if (other !== el) other.open = false;
          });
        });
      });
    }

    function wireTabs(root) {
      const tabs = root.querySelectorAll(".tab-btn");
      const panels = root.querySelectorAll(".tab-panel");
      tabs.forEach(btn => {
        btn.addEventListener("click", () => {
          tabs.forEach(t => t.setAttribute("aria-selected", "false"));
          panels.forEach(p => p.classList.remove("active"));
          btn.setAttribute("aria-selected", "true");
          root.querySelector("#" + btn.getAttribute("aria-controls")).classList.add("active");
        });
      });
    }

    function splitActiveDone(items) {
      const active = [];
      const done = [];
      items.forEach(item => {
        if (bundleProgress(item).complete) done.push(item);
        else active.push(item);
      });
      return { active, done };
    }

    function doneSectionHtml(doneItems, prefix, renderBundle) {
      if (!doneItems.length) return "";
      const inner = doneItems.map(item => renderBundle(item, prefix, true)).join("");
      return `
        <details class="prep-done">
          <summary>Done · ${doneItems.length}</summary>
          <div class="done-list">${inner}</div>
        </details>`;
    }

    function renderTlAccordion(root) {
      const { active, done } = splitActiveDone(prepItems());
      const bundles = active.map(item => {
        const p = bundleProgress(item);
        return `
          <details class="prep-bundle" data-bundle="${item.id}">
            <summary>
              <span>${bundleLabel(item)}</span>
              <span class="bundle-count">${p.done}/${p.total}</span>
            </summary>
            ${checklistRowsHtml(item, "acc-")}
          </details>`;
      }).join("");

      const doneHtml = doneSectionHtml(done, "acc-", (item) => `
        <details class="prep-bundle" open>
          <summary><span>${bundleLabel(item)}</span><span class="bundle-count">✓</span></summary>
          ${checklistRowsHtml(item, "acc-done-")}
        </details>`);

      root.innerHTML = `
        <div class="v-tl-base v-tl-accordion">
          <div class="shell">
            ${planHeaderHtml()}
            <div class="bounds-cap">↑ ${PLAN.dayBounds.wake} wake</div>
            <div class="rail-wrap">${buildTimelineRail(false)}</div>
            <div class="bounds-cap">${PLAN.dayBounds.sleep} sleep ↓</div>
            <section class="prep-section" aria-label="Pack and prep">
              <div class="prep-heading">Pack &amp; prep</div>
              ${bundles || '<p style="font-size:0.85rem;color:var(--rail)">All prep done.</p>'}
              ${doneHtml}
            </section>
          </div>
        </div>`;

      wireCheckboxes(root, () => renderTlAccordion(root));
      wireAccordion(root);
    }

    function renderTlTabs(root) {
      const { active, done } = splitActiveDone(prepItems());
      const all = active.length ? active : prepItems().slice(0, 1);
      const tabs = all.map((item, i) => {
        const p = bundleProgress(item);
        return `<button type="button" class="tab-btn" role="tab" aria-selected="${i === 0}" aria-controls="panel-${item.id}" id="tab-${item.id}">${item.title} · ${PLAN.checklists[item.checklistId].name} (${p.done}/${p.total})</button>`;
      }).join("");

      const panels = all.map((item, i) => {
        const cl = PLAN.checklists[item.checklistId];
        return `
          <div class="tab-panel${i === 0 ? " active" : ""}" role="tabpanel" id="panel-${item.id}" aria-labelledby="tab-${item.id}">
            <div class="panel-title">${item.title}</div>
            <div class="panel-sub">${cl.name}</div>
            ${checklistRowsHtml(item, "tab-")}
          </div>`;
      }).join("");

      const doneHtml = doneSectionHtml(done, "tab-", (item) => `
        <div class="tab-panel" style="display:block;opacity:0.55;margin-top:0.5rem">
          <div class="panel-title">${item.title}</div>
          <div class="panel-sub">${PLAN.checklists[item.checklistId].name}</div>
          ${checklistRowsHtml(item, "tab-done-")}
        </div>`);

      root.innerHTML = `
        <div class="v-tl-base v-tl-tabs">
          <div class="shell">
            ${planHeaderHtml()}
            <div class="bounds-cap">↑ ${PLAN.dayBounds.wake} wake</div>
            <div class="rail-wrap">${buildTimelineRail(false)}</div>
            <div class="bounds-cap">${PLAN.dayBounds.sleep} sleep ↓</div>
            <section class="prep-section" aria-label="Pack and prep">
              <div class="prep-heading">Pack &amp; prep</div>
              ${active.length ? `<div class="tab-bar" role="tablist">${tabs}</div>${panels}` : ""}
              ${doneHtml}
            </section>
          </div>
        </div>`;

      wireCheckboxes(root, () => renderTlTabs(root));
      wireTabs(root);
    }

    function renderTlCards(root) {
      const { active, done } = splitActiveDone(prepItems());
      const cards = active.map(item => {
        const p = bundleProgress(item);
        const cl = PLAN.checklists[item.checklistId];
        return `
          <details class="prep-card" data-bundle="${item.id}">
            <summary>
              ${item.title}
              <span class="card-sub">${cl.name} · ${p.done}/${p.total}</span>
            </summary>
            ${checklistRowsHtml(item, "card-")}
          </details>`;
      }).join("");

      const doneCards = done.map(item => {
        const cl = PLAN.checklists[item.checklistId];
        return `
          <details class="prep-card is-done" open>
            <summary>${item.title}<span class="card-sub">${cl.name} · done</span></summary>
            ${checklistRowsHtml(item, "card-done-")}
          </details>`;
      }).join("");

      root.innerHTML = `
        <div class="v-tl-base v-tl-cards">
          <div class="shell">
            ${planHeaderHtml()}
            <div class="bounds-cap">↑ ${PLAN.dayBounds.wake} wake</div>
            <div class="rail-wrap">${buildTimelineRail(false)}</div>
            <div class="bounds-cap">${PLAN.dayBounds.sleep} sleep ↓</div>
            <section class="prep-section" aria-label="Pack and prep">
              <div class="prep-heading">Pack &amp; prep</div>
              <div class="card-grid">${cards}${doneCards}</div>
            </section>
          </div>
        </div>`;

      wireCheckboxes(root, () => renderTlCards(root));
    }

    // ── Legacy renderers ──
    function kindBadge(kind) {
      return kind === "anchor"
        ? '<span class="badge-anchor">Anchor</span>'
        : '<span class="badge-flex">Flex</span>';
    }

    function checklistHtmlLegacy(id, prefix = "") {
      if (!id || !PLAN.checklists[id]) return "";
      const cl = PLAN.checklists[id];
      const item = PLAN.items.find(i => i.checklistId === id);
      const rows = cl.items.map((label, i) => {
        const cid = prefix + id + "-" + i;
        const checked = item && isChecked(item.id, id, i) ? " checked" : "";
        return `<li><input type="checkbox" id="${cid}"${checked}><label for="${cid}">${label}</label></li>`;
      }).join("");
      return `<ul class="checklist" aria-label="${cl.name}">${rows}</ul>`;
    }

    function renderTimelineLegacy(root) {
      root.innerHTML = `
        <div class="v-timeline"><div class="shell">
          <div class="plan-meta">
            <div class="plan-date">${PLAN.date}</div>
            <div class="plan-bounds">Wake ${PLAN.dayBounds.wake} · Sleep ${PLAN.dayBounds.sleep}</div>
            <div class="plan-weather">${PLAN.weather}</div>
          </div>
          <div class="bounds-cap">↑ ${PLAN.dayBounds.wake} wake</div>
          <div class="rail-wrap">${buildTimelineRail(true)}</div>
          <div class="bounds-cap">${PLAN.dayBounds.sleep} sleep ↓</div>
        </div></div>`;
    }

    function renderAgenda(root) {
      const rows = PLAN.items.map(item => {
        const dur = item.durationMin ?? (parseTime(item.end) - parseTime(item.start));
        return `<tr class="${item.kind}">
          <td class="col-time">${item.start}<br>${item.end}</td>
          <td class="col-dur">${formatDuration(dur)}</td>
          <td class="col-kind">${item.kind}</td>
          <td><div class="item-name">${item.title}</div>${checklistHtmlLegacy(item.checklistId, "ag-")}</td>
        </tr>`;
      }).join("");
      root.innerHTML = `
        <div class="v-agenda"><div class="sheet">
          <header><div class="plan-date">${PLAN.date}</div>
            <div class="plan-meta"><span class="plan-weather">${PLAN.weather}</span></div></header>
          <div class="bounds-row"><span>Wake ${PLAN.dayBounds.wake}</span><span>Sleep ${PLAN.dayBounds.sleep}</span></div>
          <table><thead><tr><th>Time</th><th>Dur</th><th>Kind</th><th>Item</th></tr></thead><tbody>${rows}</tbody></table>
        </div></div>`;
    }

    function renderChecklist(root) {
      const withCl = PLAN.items.filter(i => i.checklistId);
      const without = PLAN.items.filter(i => !i.checklistId);
      const bundles = withCl.map(item => `
        <article class="bundle"><div class="bundle-head">
          <div class="bundle-title">${item.title} ${kindBadge(item.kind)}</div>
          <div class="bundle-when">${item.start}–${item.end}</div></div>
          ${checklistHtmlLegacy(item.checklistId, "cl-")}
        </article>`).join("");
      const plain = without.map(item => `
        <div class="plain-row"><span>${item.title} ${kindBadge(item.kind)}</span>
          <span class="when">${item.start}–${item.end}</span></div>`).join("");
      root.innerHTML = `
        <div class="v-checklist"><div class="board">
          <div class="hero"><div class="plan-date">${PLAN.date}</div>
            <div class="plan-meta"><span>Wake ${PLAN.dayBounds.wake} · Sleep ${PLAN.dayBounds.sleep}</span><span>${PLAN.weather}</span></div></div>
          <div class="section-label">Pack &amp; prep</div>${bundles}
          <div class="section-label">Rest of day</div>${plain}
        </div></div>`;
    }

    function currentVariantKey() {
      return new URLSearchParams(location.search).get("variant") || VARIANTS[0].key;
    }

    function variantIndex(key) {
      const i = VARIANTS.findIndex(v => v.key === key);
      return i >= 0 ? i : 0;
    }

    function setVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState(null, "", url);
      render();
    }

    function cycleVariant(delta) {
      const i = variantIndex(currentVariantKey());
      setVariant(VARIANTS[(i + delta + VARIANTS.length) % VARIANTS.length].key);
    }

    function render() {
      const v = VARIANTS.find(x => x.key === currentVariantKey()) || VARIANTS[0];
      const app = document.getElementById("app");
      app.innerHTML = "";
      v.render(app);
      document.getElementById("variant-label").innerHTML =
        `<strong>${v.key}</strong><span>${v.name}</span>`;
      document.title = `PROTOTYPE — ${v.name}`;
    }

    document.getElementById("prev-variant").addEventListener("click", () => cycleVariant(-1));
    document.getElementById("next-variant").addEventListener("click", () => cycleVariant(1));
    document.addEventListener("keydown", e => {
      if (e.target.closest("input, textarea, [contenteditable=true]")) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); cycleVariant(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); cycleVariant(1); }
    });

    render();
  </script>
</body>
</html>
