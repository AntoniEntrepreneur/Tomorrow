<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #12161f;
      --paper: #1a2030;
      --ink: #e6e1d4;
      --muted: #8b93a7;
      --wick: #e0a84a;
      --anchor: #6fbfa3;
      --anchor-bg: #1a2e2a;
      --flex: #e0b896;
      --flex-bg: #2c241c;
      --draft: #8ea0c8;
      --danger: #e07a6a;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }

    .shell { max-width: 28rem; margin: 0 auto; padding: 1.25rem 1.1rem 8.5rem; }

    .header { margin-bottom: 1rem; }
    .kicker {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--wick);
    }
    .plan-date {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
      margin: 0.2rem 0 0.15rem;
    }
    .weather { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    .weather .name { color: var(--ink); font-weight: 500; }
    .chrome {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }
    .chrome button {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid rgba(224,168,74,0.28);
      border-radius: 999px;
      padding: 0.4rem 0.75rem;
      font: 600 0.72rem/1 "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .chrome button.primary { background: var(--wick); color: #12161f; border-color: var(--wick); }
    .chrome button:disabled { opacity: 0.4; cursor: not-allowed; }

    .template-offer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem 0.75rem;
      margin: 0 0 1rem;
      padding: 0.7rem 0.85rem;
      background: var(--paper);
      border: 1px solid rgba(224,168,74,0.35);
      border-radius: 12px;
    }
    .template-offer[hidden] { display: none; }
    .template-offer p { flex: 1 1 10rem; font-size: 0.88rem; font-weight: 500; }
    .template-offer .actions { display: flex; gap: 0.4rem; }
    .template-offer button {
      font: 600 0.78rem/1 "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .template-offer .primary {
      background: var(--wick);
      color: #12161f;
      border: 1px solid var(--wick);
    }
    .template-offer .ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(224,168,74,0.28);
    }

    .stamps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; margin: 1rem 0 1.25rem; }
    .stamp {
      border: 2px solid currentColor;
      background: transparent;
      border-radius: 3px;
      padding: 0.7rem 0.3rem 0.55rem;
      cursor: pointer;
      font: 700 0.72rem/1 "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .stamp.anchor { color: var(--anchor); }
    .stamp.flex { color: var(--flex); }
    .stamp.draft { color: var(--draft); }
    .stamp span { display: block; font-size: 1.35rem; line-height: 1; margin-bottom: 0.2rem; font-weight: 400; }

    .drafts { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0 0 0.85rem; }
    .drafts.empty { display: none; }
    .drafts-label {
      flex: 0 0 100%;
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
    }
    .draft-chip {
      display: flex; align-items: center; gap: 0.35rem;
      background: rgba(142,160,200,0.14);
      border: 1px dashed var(--draft);
      color: var(--draft);
      border-radius: 999px;
      padding: 0.25rem 0.35rem 0.25rem 0.65rem;
      font-size: 0.78rem;
    }
    .draft-chip button {
      background: transparent; border: none; color: inherit; cursor: pointer;
      font-size: 0.68rem; padding: 0.15rem 0.35rem;
    }

    .blockers { color: var(--danger); font-size: 0.8rem; margin-bottom: 0.85rem; }

    .rail-cap {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--muted);
      background: none;
      border: 1px dashed rgba(224,168,74,0.35);
      border-radius: 8px;
      padding: 0.35rem 0.55rem;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .rail-cap:hover { border-color: var(--wick); color: var(--ink); }

    .rail-wrap { position: relative; padding-left: 3.4rem; margin: 0.45rem 0; }
    .rail-wrap::before {
      content: "";
      position: absolute;
      left: 1.15rem; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(var(--wick), transparent 96%);
      border-radius: 2px;
    }
    .block {
      position: relative;
      margin-bottom: 0.3rem;
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      width: 100%;
      text-align: left;
      color: inherit;
      font: inherit;
    }
    .block.anchor { background: var(--anchor-bg); border: none; border-left: 3px solid var(--anchor); }
    .block.flex { background: var(--flex-bg); border: none; border-left: 3px dashed var(--flex); }
    .block .time-tag, .gap .time-tag {
      position: absolute; left: -3.4rem; width: 3rem; text-align: right;
      font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; color: var(--muted);
    }
    .block .time-tag { top: 0.65rem; }
    .block-title { font-weight: 600; font-size: 0.95rem; }
    .block-checklist { font-size: 0.72rem; color: var(--muted); margin-top: 0.12rem; }
    .block-range { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; opacity: 0.6; margin-top: 0.12rem; }
    .gap {
      position: relative;
      margin-bottom: 0.3rem;
      border: 1px dashed rgba(224,168,74,0.45);
      border-radius: 10px;
      background: rgba(224,168,74,0.06);
      color: var(--wick);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45rem 0.75rem;
      font-size: 0.75rem;
      width: 100%;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .gap.armed { outline: 2px solid var(--wick); }
    .gap .cta { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.65rem; }

    .tray {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
      background: #0e121a;
      border-top: 1px solid rgba(224,168,74,0.25);
      padding: 0.55rem 1rem 0.85rem;
    }
    .tray-label {
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.35rem;
    }
    .tray.empty { color: var(--muted); font-size: 0.78rem; }
    .tray-chips { display: flex; gap: 0.4rem; overflow-x: auto; }
    .flex-chip {
      flex: 0 0 auto;
      background: var(--flex-bg);
      color: var(--flex);
      border: 1px solid rgba(224,184,150,0.55);
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 9.5rem;
      text-align: left;
    }
    .flex-chip.armed { outline: 2px solid var(--wick); }
    .flex-chip .name { font-weight: 600; display: block; }
    .flex-chip .meta { font-family: "IBM Plex Mono", monospace; font-size: 0.65rem; opacity: 0.75; }
    .flex-chip .ops { display: flex; gap: 0.25rem; margin-top: 0.25rem; }
    .flex-chip .ops button {
      background: transparent; border: 1px solid rgba(224,184,150,0.35);
      color: inherit; border-radius: 999px; font-size: 0.62rem;
      padding: 0.1rem 0.4rem; cursor: pointer;
    }

    .sheet-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 250;
      background: rgba(10, 12, 16, 0.55);
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: min(28rem, 100%);
      max-height: 85dvh;
      overflow: auto;
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px 16px 0 0;
      padding: 1.1rem 1.15rem 2.25rem;
      border-top: 1px solid rgba(224,168,74,0.28);
    }
    .sheet h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.85rem; }
    .sheet label { display: block; font-size: 0.75rem; font-weight: 600; margin: 0.65rem 0 0.25rem; }
    .sheet input, .sheet select {
      width: 100%;
      font: 400 1rem/1.3 "IBM Plex Sans", system-ui, sans-serif;
      padding: 0.5rem 0.6rem;
      border: 1px solid rgba(224,168,74,0.28);
      border-radius: 8px;
      background: #12161f;
      color: var(--ink);
    }
    .sheet .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .sheet .actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .sheet button {
      font: 600 0.88rem/1 "IBM Plex Sans", system-ui, sans-serif;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .sheet .primary { background: var(--wick); color: #12161f; }
    .sheet .ghost { background: transparent; border: 1px solid rgba(224,168,74,0.28); color: var(--ink); }
    .sheet .choice-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0.4rem 0 0.8rem; }
    .sheet .choice-row button {
      background: transparent; border: 1px solid rgba(224,168,74,0.35); color: var(--ink);
    }
    .sheet .hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; }
    .sheet .danger { background: var(--danger); color: #fff; margin-left: auto; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="kicker">Tonight’s Session</div>
      <p class="plan-date" id="plan-date"></p>
      <div class="weather" id="weather"></div>
      <div class="chrome">
        <button type="button" id="undo" disabled>Undo</button>
        <button type="button" id="redo" disabled>Redo</button>
        <button type="button" id="reset">Reset</button>
        <button type="button" class="primary" id="submit">Submit</button>
      </div>
    </header>

    <div class="template-offer" id="template-offer" hidden>
      <p>Use this weekday's Template?</p>
      <div class="actions">
        <button type="button" class="primary" id="template-yes">Yes</button>
        <button type="button" class="ghost" id="template-no">No</button>
      </div>
    </div>

    <div class="stamps">
      <button type="button" class="stamp anchor" id="stamp-anchor"><span>A</span>Anchor</button>
      <button type="button" class="stamp flex" id="stamp-flex"><span>F</span>Flex</button>
      <button type="button" class="stamp draft" id="stamp-draft"><span>D</span>Draft</button>
    </div>

    <div class="drafts empty" id="drafts"></div>

    <div class="blockers" id="blockers"></div>

    <button type="button" class="rail-cap" id="wake-cap">↑ wake</button>
    <div class="rail-wrap" id="rail"></div>
    <button type="button" class="rail-cap" id="sleep-cap">sleep ↓</button>
  </div>

  <div class="tray empty" id="tray">
    <div class="tray-label">Unplaced Flex — Place / Shrink / Drop any time</div>
    <div>No unplaced Flex.</div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    let current = null;
    let sheetOpen = false;
    let sheetKind = null;
    let armedFlexId = null;

    function esc(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function toMin(clock) {
      const [hours, minutes] = String(clock).split(":").map(Number);
      return hours * 60 + minutes;
    }

    function toClock(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return String(hours).padStart(2, "0") + ":" + String(mins).padStart(2, "0");
    }

    function endClock(start, durationMin) {
      return toClock(toMin(start) + Number(durationMin));
    }

    function fmtDur(minutes) {
      const value = Number(minutes);
      if (value >= 60 && value % 60 === 0) return (value / 60) + "h";
      if (value >= 60) return Math.floor(value / 60) + "h " + (value % 60) + "m";
      return value + "m";
    }

    function clockValue(input) {
      return String(input.value || "").slice(0, 5);
    }

    function normalizeName(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function checklistName(checklistId) {
      if (!checklistId || !current) return "";
      const entry = (current.checklists || []).find(item => item.id === checklistId);
      return entry ? entry.name : "";
    }

    function suggestChecklist(itemName) {
      const needle = normalizeName(itemName);
      if (!needle || !current) return "";
      const matches = (current.checklists || []).filter(entry => {
        const id = normalizeName(entry.id);
        const name = normalizeName(entry.name);
        return (id && (needle.includes(id) || id.includes(needle))) ||
          (name && (needle.includes(name) || name.includes(needle)));
      });
      return matches.length === 1 ? matches[0].id : "";
    }

    function checklistField(selectedId) {
      const selected = selectedId || "";
      const options = (current && current.checklists || []).map(entry =>
        '<option value="' + esc(entry.id) + '"' +
        (entry.id === selected ? " selected" : "") + ">" +
        esc(entry.name) + "</option>"
      ).join("");
      return '<label>Checklist <select name="checklist"' +
        (selected ? ' data-touched="1"' : "") + ">" +
        '<option value="">None</option>' + options + "</select></label>";
    }

    function maybeSuggestChecklist(form) {
      if (!form || !form.checklist) return;
      if (form.checklist.dataset.touched === "1") return;
      form.checklist.value = suggestChecklist(form.name && form.name.value);
    }

    function checklistPayload(form) {
      const value = form.checklist ? form.checklist.value : "";
      return value || null;
    }

    function heightPx(durationMin, total, floor) {
      return Math.max(floor, Math.round((durationMin / Math.max(total, 1)) * 520));
    }

    function railRows(session) {
      const wake = toMin(session.bounds.wake);
      const sleep = toMin(session.bounds.sleep);
      const occupied = (session.anchors || []).map(item => ({
        kind: "anchor",
        id: item.id,
        name: item.name,
        start: item.start,
        durationMin: item.duration_minutes,
        end: endClock(item.start, item.duration_minutes),
        checklist: item.checklist
      })).concat((session.flexes || []).filter(item => item.start).map(item => ({
        kind: "flex",
        id: item.id,
        name: item.name,
        start: item.start,
        durationMin: item.duration_minutes,
        end: endClock(item.start, item.duration_minutes),
        checklist: item.checklist
      }))).sort((a, b) => toMin(a.start) - toMin(b.start));
      const rows = [];
      let cursor = wake;
      for (const item of occupied) {
        const start = toMin(item.start);
        if (start > cursor) {
          rows.push({
            kind: "gap",
            start: toClock(cursor),
            end: item.start,
            durationMin: start - cursor
          });
        }
        rows.push(item);
        cursor = Math.max(cursor, toMin(item.end));
      }
      if (sleep > cursor) {
        rows.push({
          kind: "gap",
          start: toClock(cursor),
          end: toClock(sleep),
          durationMin: sleep - cursor
        });
      }
      return rows;
    }

    function sessionUndoBlocked() {
      return sheetKind === "edit";
    }

    function setChromeEnabled() {
      if (!current) return;
      const blocked = sessionUndoBlocked();
      document.getElementById("undo").disabled = blocked || !current.can_undo;
      document.getElementById("redo").disabled = blocked || !current.can_redo;
      document.getElementById("submit").disabled = (current.blockers || []).length > 0;
    }

    function renderRail(session) {
      const total = Math.max(1, toMin(session.bounds.sleep) - toMin(session.bounds.wake));
      document.getElementById("rail").innerHTML = railRows(session).map(row => {
        if (row.kind === "gap") {
          const armed = armedFlexId ? " armed" : "";
          const cta = armedFlexId ? "Place here" : "Place Flex";
          return '<button type="button" class="gap' + armed + '" data-kind="gap" data-start="' +
            esc(row.start) + '" data-end="' + esc(row.end) + '" style="min-height:' +
            heightPx(row.durationMin, total, 40) + 'px">' +
            '<span class="time-tag">' + esc(row.start) + "</span>" +
            "<span>Gap · " + esc(fmtDur(row.durationMin)) + "</span>" +
            '<span class="cta">' + cta + "</span></button>";
        }
        const checklistLabel = checklistName(row.checklist);
        return '<button type="button" class="block ' + row.kind + '" data-kind="' + row.kind +
          '" data-id="' + esc(row.id) + '" style="min-height:' + heightPx(row.durationMin, total, 52) + 'px">' +
          '<span class="time-tag">' + esc(row.start) + "</span>" +
          '<div class="block-title">' + esc(row.name) + "</div>" +
          (checklistLabel ? '<div class="block-checklist">' + esc(checklistLabel) + "</div>" : "") +
          '<div class="block-range">' + esc(row.start) + "–" + esc(row.end) +
          " · " + esc(fmtDur(row.durationMin)) + "</div></button>";
      }).join("");
    }

    function renderTray(session) {
      const unplaced = (session.flexes || []).filter(item => !item.start);
      const tray = document.getElementById("tray");
      if (!unplaced.length) {
        tray.classList.add("empty");
        tray.innerHTML =
          '<div class="tray-label">Unplaced Flex — Place / Shrink / Drop any time</div>' +
          "<div>No unplaced Flex.</div>";
        return;
      }
      tray.classList.remove("empty");
      tray.innerHTML =
        '<div class="tray-label">Unplaced Flex — Place / Shrink / Drop any time</div>' +
        '<div class="tray-chips">' + unplaced.map(item =>
          '<div class="flex-chip' + (armedFlexId === item.id ? " armed" : "") +
          '" data-arm="' + esc(item.id) + '">' +
          '<span class="name">' + esc(item.name) + "</span>" +
          '<span class="meta">' + esc(fmtDur(item.duration_minutes)) + " · unplaced</span>" +
          '<div class="ops">' +
          '<button type="button" data-edit-flex="' + esc(item.id) + '">Edit</button>' +
          '<button type="button" data-place="' + esc(item.id) + '">Place</button>' +
          '<button type="button" data-shrink="' + esc(item.id) + '">Shrink</button>' +
          '<button type="button" data-drop="' + esc(item.id) + '">Drop</button>' +
          "</div></div>"
        ).join("") + "</div>";
    }

    function renderDrafts(session) {
      const drafts = session.drafts || [];
      const list = document.getElementById("drafts");
      if (!drafts.length) {
        list.classList.add("empty");
        list.innerHTML = "";
        return;
      }
      list.classList.remove("empty");
      list.innerHTML =
        '<div class="drafts-label">Drafts</div>' +
        drafts.map(item =>
          '<div class="draft-chip">' +
          "<span>" + esc(item.name) + "</span>" +
          '<button type="button" data-promote="' + esc(item.id) + '">Promote</button>' +
          '<button type="button" data-drop-draft="' + esc(item.id) + '">Drop</button>' +
          "</div>"
        ).join("");
    }

    function render(session) {
      current = session;
      if (armedFlexId) {
        const stillUnplaced = (session.flexes || []).some(
          item => item.id === armedFlexId && !item.start
        );
        if (!stillUnplaced) armedFlexId = null;
      }
      document.title = session.plan_date_label;
      document.getElementById("plan-date").textContent = session.plan_date_label;
      const weatherBits = [];
      if (session.weather_name) {
        weatherBits.push('<span class="name">' + esc(session.weather_name) + "</span>");
      }
      if (session.weather_one_liner) weatherBits.push(esc(session.weather_one_liner));
      document.getElementById("weather").innerHTML = weatherBits.join(" · ");
      document.getElementById("blockers").textContent = (session.blockers || []).join(" ");
      document.getElementById("wake-cap").textContent = "↑ " + session.bounds.wake + " wake";
      document.getElementById("sleep-cap").textContent = session.bounds.sleep + " sleep ↓";
      renderTemplateOffer(session);
      renderRail(session);
      renderDrafts(session);
      renderTray(session);
      setChromeEnabled();
    }

    function renderTemplateOffer(session) {
      document.getElementById("template-offer").hidden = !session.show_template_offer;
    }

    function openSheet(html, kind) {
      const backdrop = document.getElementById("sheet-backdrop");
      document.getElementById("sheet").innerHTML = html;
      backdrop.hidden = false;
      backdrop.classList.add("open");
      sheetOpen = true;
      sheetKind = kind || "edit";
      setChromeEnabled();
      const first = document.getElementById("sheet").querySelector("input, button");
      if (first) first.focus();
    }

    function closeSheet() {
      const backdrop = document.getElementById("sheet-backdrop");
      backdrop.classList.remove("open");
      backdrop.hidden = true;
      document.getElementById("sheet").innerHTML = "";
      sheetOpen = false;
      sheetKind = null;
      setChromeEnabled();
    }

    function formFields(name, start, durationMin) {
      return '<label>Name <input name="name" required value="' + esc(name || "") + '"></label>' +
        '<div class="row">' +
        '<label>Start <input name="start" type="time" required value="' + esc(start || "") + '"></label>' +
        '<label>Duration (min) <input name="duration_minutes" type="number" min="1" required value="' +
        esc(durationMin || "") + '"></label></div>';
    }

    function findFlex(itemId) {
      return (current.flexes || []).find(item => item.id === itemId);
    }

    function findDraft(itemId) {
      return (current.drafts || []).find(item => item.id === itemId);
    }

    function gapRows() {
      return railRows(current).filter(row => row.kind === "gap");
    }

    function sheetAddFlex() {
      openSheet(
        "<h2>Add Flex</h2><p class=\"hint\">Unplaced Flex lands in the tray. Place it whenever you notice a Gap.</p>" +
        "<form id=\"add-flex\">" +
        '<label>Name <input name="name" required></label>' +
        '<label>Duration (min) <input name="duration_minutes" type="number" min="1" required value="45"></label>' +
        checklistField("") +
        '<div class="actions"><button class="primary" type="submit">Add Flex</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button></div></form>',
        "stamp"
      );
      maybeSuggestChecklist(document.getElementById("add-flex"));
    }

    function sheetAddDraft() {
      openSheet(
        "<h2>Add Draft</h2><p class=\"hint\">Optional capture. Promote to Anchor or Flex, or Drop, before Submit.</p>" +
        "<form id=\"add-draft\">" +
        '<label>Name <input name="name" required></label>' +
        '<div class="actions"><button class="primary" type="submit">Add Draft</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button></div></form>',
        "stamp"
      );
    }

    function sheetPromote(item) {
      openSheet(
        "<h2>Promote Draft · " + esc(item.name) + "</h2>" +
        '<p class="hint">A new opaque id is minted. The Draft’s id does not leak.</p>' +
        '<form id="promote-draft" data-id="' + esc(item.id) + '">' +
        '<label>Promote to <select name="kind">' +
        '<option value="anchor">Anchor</option>' +
        '<option value="flex">Flex</option>' +
        "</select></label>" +
        '<div class="row">' +
        '<label id="promote-start-label">Start <input name="start" type="time" required value="09:00"></label>' +
        '<label>Duration (min) <input name="duration_minutes" type="number" min="1" required value="30"></label></div>' +
        '<p class="hint" id="promote-flex-hint" hidden>Flex lands unplaced in the tray. Place it whenever you notice a Gap.</p>' +
        '<div class="actions"><button class="primary" type="submit">Promote</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button>' +
        '<button type="button" class="danger" data-drop-draft="' + esc(item.id) + '">Drop</button></div></form>'
      );
      const form = document.getElementById("promote-draft");
      const kind = form.querySelector('[name="kind"]');
      kind.addEventListener("change", () => syncPromoteFields(form));
    }

    function syncPromoteFields(form) {
      const asFlex = form.kind.value === "flex";
      form.start.required = !asFlex;
      document.getElementById("promote-start-label").hidden = asFlex;
      document.getElementById("promote-flex-hint").hidden = !asFlex;
    }

    function sheetPlace(item) {
      const opts = gapRows().map(gap =>
        '<button type="button" data-place-at="' + esc(item.id) + '" data-start="' + esc(gap.start) + '">' +
        esc(gap.start) + "–" + esc(gap.end) + " · " + esc(fmtDur(gap.durationMin)) + "</button>"
      ).join("");
      openSheet(
        "<h2>Place Flex · " + esc(item.name) + " (" + esc(fmtDur(item.duration_minutes)) + ")</h2>" +
        '<p class="hint">Snap to a Gap start, or type a clock time.</p>' +
        '<div class="choice-row">' + (opts || "<span>No Gaps.</span>") + "</div>" +
        '<form id="place-flex" data-id="' + esc(item.id) + '">' +
        '<label>Start <input name="start" type="time" required></label>' +
        '<div class="actions"><button class="primary" type="submit">Place</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button></div></form>'
      );
    }

    function sheetShrink(item) {
      openSheet(
        "<h2>Shrink Flex · " + esc(item.name) + "</h2>" +
        '<form id="shrink-flex" data-id="' + esc(item.id) + '">' +
        '<label>New duration (min) <input name="duration_minutes" type="number" min="1" required value="' +
        esc(item.duration_minutes) + '"></label>' +
        '<div class="actions"><button class="primary" type="submit">Shrink</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button></div></form>'
      );
    }

    function sheetGapPlace(start, end) {
      const unplaced = (current.flexes || []).filter(item => !item.start);
      const opts = unplaced.map(item =>
        '<button type="button" data-place-at="' + esc(item.id) + '" data-start="' + esc(start) + '">' +
        esc(item.name) + " · " + esc(fmtDur(item.duration_minutes)) + "</button>"
      ).join("");
      openSheet(
        "<h2>Place into this Gap</h2>" +
        '<p class="hint">Gap ' + esc(start) + "–" + esc(end) + ". Stamp Flex to add to the tray; clicking a Gap Places it.</p>" +
        '<div class="choice-row">' + (opts || "<span>No unplaced Flex.</span>") + "</div>" +
        '<div class="actions"><button type="button" class="ghost" data-close>Cancel</button></div>'
      );
    }

    function sheetEditFlex(item) {
      const placedHint = item.start
        ? esc(item.start) + " · " + esc(fmtDur(item.duration_minutes))
        : "Unplaced · " + esc(fmtDur(item.duration_minutes));
      openSheet(
        "<h2>Flex · " + esc(item.name) + "</h2>" +
        '<p class="hint">' + placedHint + "</p>" +
        '<form id="edit-flex" data-id="' + esc(item.id) + '">' +
        '<label>Name <input name="name" required value="' + esc(item.name) + '"></label>' +
        '<label>Duration (min) <input name="duration_minutes" type="number" min="1" required value="' +
        esc(item.duration_minutes) + '"></label>' +
        checklistField(item.checklist) +
        '<div class="actions"><button class="primary" type="submit">Update</button>' +
        '<button type="button" class="ghost" data-place="' + esc(item.id) + '">Place</button>' +
        '<button type="button" class="ghost" data-shrink="' + esc(item.id) + '">Shrink</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button>' +
        '<button type="button" class="danger" data-drop="' + esc(item.id) + '">Drop</button></div></form>'
      );
      maybeSuggestChecklist(document.getElementById("edit-flex"));
    }

    function sheetAddAnchor() {
      openSheet(
        "<h2>Add Anchor</h2><form id=\"add-anchor\">" +
        formFields("", "", 60) +
        checklistField("") +
        '<div class="actions"><button class="primary" type="submit">Add Anchor</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button></div></form>',
        "stamp"
      );
      maybeSuggestChecklist(document.getElementById("add-anchor"));
    }

    function sheetEditAnchor(item) {
      openSheet(
        "<h2>Edit Anchor</h2><form id=\"edit-anchor\" data-id=\"" + esc(item.id) + "\">" +
        formFields(item.name, item.start, item.duration_minutes) +
        checklistField(item.checklist) +
        '<div class="actions"><button class="primary" type="submit">Update</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button>' +
        '<button type="button" class="danger" data-remove="' + esc(item.id) + '">Remove</button></div></form>'
      );
      maybeSuggestChecklist(document.getElementById("edit-anchor"));
    }

    function sheetEditBound(which) {
      const value = current.bounds[which];
      const label = which === "wake" ? "Wake" : "Sleep";
      openSheet(
        "<h2>Edit " + label + "</h2><form id=\"edit-bounds\" data-which=\"" + which + "\">" +
        "<label>" + label + ' <input name="clock" type="time" required value="' + esc(value) + '"></label>' +
        '<div class="actions"><button class="primary" type="submit">Update</button>' +
        '<button type="button" class="ghost" data-close>Cancel</button></div></form>'
      );
    }

    async function mutate(path, payload) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const session = await response.json();
      closeSheet();
      render(session);
      return session;
    }

    async function loadSession() {
      const response = await fetch("/api/session");
      render(await response.json());
    }

    async function dropFlex(itemId) {
      armedFlexId = armedFlexId === itemId ? null : armedFlexId;
      await mutate("/api/drop", { kind: "flex", id: itemId });
    }

    async function dropDraft(itemId) {
      await mutate("/api/drop", { kind: "draft", id: itemId });
    }

    async function placeFlexAt(itemId, start) {
      armedFlexId = null;
      await mutate("/api/place", { id: itemId, start: start });
    }

    document.getElementById("stamp-anchor").addEventListener("click", sheetAddAnchor);
    document.getElementById("stamp-flex").addEventListener("click", sheetAddFlex);
    document.getElementById("stamp-draft").addEventListener("click", sheetAddDraft);
    document.getElementById("wake-cap").addEventListener("click", () => sheetEditBound("wake"));
    document.getElementById("sleep-cap").addEventListener("click", () => sheetEditBound("sleep"));
    document.getElementById("rail").addEventListener("click", event => {
      if (!current) return;
      const gap = event.target.closest("[data-kind='gap']");
      if (gap) {
        if (armedFlexId) {
          placeFlexAt(armedFlexId, gap.dataset.start);
          return;
        }
        sheetGapPlace(gap.dataset.start, gap.dataset.end);
        return;
      }
      const block = event.target.closest("[data-kind]");
      if (!block) return;
      if (block.dataset.kind === "anchor") {
        const item = current.anchors.find(anchor => anchor.id === block.dataset.id);
        if (item) sheetEditAnchor(item);
        return;
      }
      if (block.dataset.kind === "flex") {
        const item = findFlex(block.dataset.id);
        if (item) sheetEditFlex(item);
      }
    });

    document.getElementById("drafts").addEventListener("click", event => {
      const dropId = event.target.dataset.dropDraft;
      if (dropId) {
        dropDraft(dropId);
        return;
      }
      const promoteId = event.target.dataset.promote;
      if (!promoteId) return;
      const item = findDraft(promoteId);
      if (item) sheetPromote(item);
    });

    document.getElementById("tray").addEventListener("click", event => {
      const dropId = event.target.dataset.drop;
      if (dropId) {
        event.stopPropagation();
        dropFlex(dropId);
        return;
      }
      const placeId = event.target.dataset.place;
      if (placeId) {
        event.stopPropagation();
        const item = findFlex(placeId);
        if (item) sheetPlace(item);
        return;
      }
      const shrinkId = event.target.dataset.shrink;
      if (shrinkId) {
        event.stopPropagation();
        const item = findFlex(shrinkId);
        if (item) sheetShrink(item);
        return;
      }
      const editId = event.target.dataset.editFlex;
      if (editId) {
        event.stopPropagation();
        const item = findFlex(editId);
        if (item) sheetEditFlex(item);
        return;
      }
      const chip = event.target.closest("[data-arm]");
      if (!chip) return;
      armedFlexId = armedFlexId === chip.dataset.arm ? null : chip.dataset.arm;
      if (current) render(current);
    });

    document.getElementById("sheet-backdrop").addEventListener("click", event => {
      if (event.target.id === "sheet-backdrop" || event.target.dataset.close !== undefined) {
        closeSheet();
      }
    });

    document.getElementById("sheet").addEventListener("click", async event => {
      const removeId = event.target.dataset.remove;
      if (removeId) {
        event.preventDefault();
        await mutate("/api/edit", { kind: "anchor", id: removeId, remove: true });
        return;
      }
      const dropId = event.target.dataset.drop;
      if (dropId) {
        event.preventDefault();
        await dropFlex(dropId);
        return;
      }
      const dropDraftId = event.target.dataset.dropDraft;
      if (dropDraftId) {
        event.preventDefault();
        await dropDraft(dropDraftId);
        return;
      }
      const placeAt = event.target.dataset.placeAt;
      if (placeAt) {
        event.preventDefault();
        await placeFlexAt(placeAt, event.target.dataset.start);
        return;
      }
      const placeId = event.target.dataset.place;
      if (placeId) {
        event.preventDefault();
        const item = findFlex(placeId);
        if (item) sheetPlace(item);
        return;
      }
      const shrinkId = event.target.dataset.shrink;
      if (shrinkId) {
        event.preventDefault();
        const item = findFlex(shrinkId);
        if (item) sheetShrink(item);
      }
    });

    document.getElementById("sheet").addEventListener("input", event => {
      const form = event.target.form;
      if (!form) return;
      if (event.target.name === "checklist") {
        event.target.dataset.touched = "1";
        return;
      }
      if (event.target.name === "name") maybeSuggestChecklist(form);
    });

    document.getElementById("sheet").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.target;
      if (form.id === "add-anchor") {
        await mutate("/api/add", {
          kind: "anchor",
          name: form.name.value,
          start: clockValue(form.start),
          duration_minutes: Number(form.duration_minutes.value),
          checklist: checklistPayload(form)
        });
        return;
      }
      if (form.id === "add-flex") {
        await mutate("/api/add", {
          kind: "flex",
          name: form.name.value,
          duration_minutes: Number(form.duration_minutes.value),
          checklist: checklistPayload(form)
        });
        return;
      }
      if (form.id === "add-draft") {
        await mutate("/api/add", {
          kind: "draft",
          name: form.name.value
        });
        return;
      }
      if (form.id === "promote-draft") {
        const payload = {
          id: form.dataset.id,
          kind: form.kind.value,
          duration_minutes: Number(form.duration_minutes.value)
        };
        if (form.kind.value === "anchor") payload.start = clockValue(form.start);
        await mutate("/api/promote", payload);
        return;
      }
      if (form.id === "place-flex") {
        await placeFlexAt(form.dataset.id, clockValue(form.start));
        return;
      }
      if (form.id === "shrink-flex") {
        await mutate("/api/shrink", {
          id: form.dataset.id,
          duration_minutes: Number(form.duration_minutes.value)
        });
        return;
      }
      if (form.id === "edit-anchor") {
        await mutate("/api/edit", {
          kind: "anchor",
          id: form.dataset.id,
          name: form.name.value,
          start: clockValue(form.start),
          duration_minutes: Number(form.duration_minutes.value),
          checklist: checklistPayload(form)
        });
        return;
      }
      if (form.id === "edit-flex") {
        await mutate("/api/edit", {
          kind: "flex",
          id: form.dataset.id,
          name: form.name.value,
          duration_minutes: Number(form.duration_minutes.value),
          checklist: checklistPayload(form)
        });
        return;
      }
      if (form.id === "edit-bounds") {
        const payload = { kind: "bounds" };
        payload[form.dataset.which] = clockValue(form.clock);
        await mutate("/api/edit", payload);
      }
    });

    function isTypingTarget(target) {
      return !!(target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA"));
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && sheetOpen) {
        closeSheet();
        return;
      }
      const key = event.key.toLowerCase();
      const modifier = event.metaKey || event.ctrlKey;
      if (!modifier) {
        if (sheetOpen) return;
        if (isTypingTarget(event.target)) return;
        if (key === "a") {
          event.preventDefault();
          sheetAddAnchor();
        } else if (key === "f") {
          event.preventDefault();
          sheetAddFlex();
        } else if (key === "d") {
          event.preventDefault();
          sheetAddDraft();
        }
        return;
      }
      const redo = (key === "z" && event.shiftKey) || (key === "y" && event.ctrlKey);
      if (key !== "z" && !(key === "y" && event.ctrlKey)) return;
      if (isTypingTarget(event.target) && key === "z" && !event.shiftKey) return;
      if (sessionUndoBlocked()) return;
      if (redo) {
        if (!current || !current.can_redo) return;
        event.preventDefault();
        mutate("/api/redo", {});
        return;
      }
      if (!current || !current.can_undo) return;
      event.preventDefault();
      mutate("/api/undo", {});
    });

    document.getElementById("submit").addEventListener("click", async () => {
      const response = await fetch("/api/submit", { method: "POST" });
      if (response.status === 409) {
        render(await response.json());
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      const response = await fetch("/api/reset", { method: "POST" });
      render(await response.json());
    });

    document.getElementById("undo").addEventListener("click", () => {
      if (sessionUndoBlocked()) return;
      mutate("/api/undo", {});
    });
    document.getElementById("redo").addEventListener("click", () => {
      if (sessionUndoBlocked()) return;
      mutate("/api/redo", {});
    });

    document.getElementById("template-yes").addEventListener("click", () => {
      mutate("/api/template", { action: "apply" });
    });
    document.getElementById("template-no").addEventListener("click", () => {
      mutate("/api/template", { action: "decline" });
    });

    loadSession();
  </script>
</body>
</html>
