<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #12161f;
      --paper: #1a2030;
      --ink: #e6e1d4;
      --muted: #8b93a7;
      --wick: #e0a84a;
      --anchor: #6fbfa3;
      --anchor-bg: #1a2e2a;
      --flex: #e0b896;
      --flex-bg: #2c241c;
      --draft: #8ea0c8;
      --todo: #c98ec8;
      --todo-bg: #2a1f2c;
      --danger: #e07a6a;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }

    .shell { max-width: 28rem; margin: 0 auto; padding: 1.25rem 1.1rem 14rem; }

    .header { margin-bottom: 1rem; }
    .kicker {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--wick);
    }
    .plan-date {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
      margin: 0.2rem 0 0.15rem;
    }
    .weather { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    .weather .name { color: var(--ink); font-weight: 500; }
    .chrome {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }
    .chrome button {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid rgba(224,168,74,0.28);
      border-radius: 999px;
      padding: 0.4rem 0.75rem;
      font: 600 0.72rem/1 "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .chrome button.primary { background: var(--wick); color: #12161f; border-color: var(--wick); }
    .chrome button:disabled { opacity: 0.4; cursor: not-allowed; }

    .template-offer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem 0.75rem;
      margin: 0 0 1rem;
      padding: 0.7rem 0.85rem;
      background: var(--paper);
      border: 1px solid rgba(224,168,74,0.35);
      border-radius: 12px;
    }
    .template-offer[hidden] { display: none; }
    .template-offer p { flex: 1 1 10rem; font-size: 0.88rem; font-weight: 500; }
    .template-offer .actions { display: flex; gap: 0.4rem; }
    .template-offer button {
      font: 600 0.78rem/1 "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .template-offer .primary {
      background: var(--wick);
      color: #12161f;
      border: 1px solid var(--wick);
    }
    .template-offer .ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(224,168,74,0.28);
    }

    .stamps { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.4rem; margin: 1rem 0 1.25rem; }
    .stamp {
      border: 2px solid currentColor;
      background: transparent;
      border-radius: 3px;
      padding: 0.7rem 0.3rem 0.55rem;
      cursor: pointer;
      font: 700 0.72rem/1 "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .stamp.anchor { color: var(--anchor); }
    .stamp.flex { color: var(--flex); }
    .stamp.draft { color: var(--draft); }
    .stamp.todo { color: var(--todo); }
    .stamp span { display: block; font-size: 1.35rem; line-height: 1; margin-bottom: 0.2rem; font-weight: 400; }

    .drafts { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0 0 0.85rem; }
    .drafts.empty { display: none; }
    .drafts-label {
      flex: 0 0 100%;
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
    }
    .draft-chip {
      display: flex; align-items: center; gap: 0.35rem;
      background: rgba(142,160,200,0.14);
      border: 1px dashed var(--draft);
      color: var(--draft);
      border-radius: 999px;
      padding: 0.25rem 0.35rem 0.25rem 0.65rem;
      font-size: 0.78rem;
    }
    .draft-chip button {
      background: transparent; border: none; color: inherit; cursor: pointer;
      font-size: 0.68rem; padding: 0.15rem 0.35rem;
    }
    .draft-chip { flex-direction: column; align-items: flex-start; }
    .draft-chip .row { display: flex; align-items: center; gap: 0.35rem; width: 100%; }
    .draft-note { font-size: 0.68rem; opacity: 0.75; white-space: pre-line; margin-top: 0.1rem; }

    .blockers { color: var(--danger); font-size: 0.8rem; margin-bottom: 0.85rem; }
    .blockers[hidden] { display: none; }

    .rail-cap {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--muted);
      background: none;
      border: 1px dashed rgba(224,168,74,0.35);
      border-radius: 8px;
      padding: 0.35rem 0.55rem;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .rail-cap:hover { border-color: var(--wick); color: var(--ink); }

    .rail-wrap { position: relative; padding-left: 3.4rem; margin: 0.45rem 0; }
    .rail-wrap::before {
      content: "";
      position: absolute;
      left: 1.15rem; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(var(--wick), transparent 96%);
      border-radius: 2px;
    }
    .block {
      position: relative;
      margin-bottom: 0.3rem;
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      width: 100%;
      text-align: left;
      color: inherit;
      font: inherit;
    }
    .block.anchor { background: var(--anchor-bg); border: none; border-left: 3px solid var(--anchor); }
    .block.flex { background: var(--flex-bg); border: none; border-left: 3px dashed var(--flex); }
    .block .time-tag, .gap .time-tag {
      position: absolute; left: -3.4rem; width: 3rem; text-align: right;
      font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; color: var(--muted);
    }
    .block .time-tag { top: 0.65rem; }
    .block-title { font-weight: 600; font-size: 0.95rem; }
    .block-checklist { font-size: 0.72rem; color: var(--muted); margin-top: 0.12rem; }
    .icloud-tag { font-size: 0.7rem; color: var(--muted); margin-left: 0.35rem; }
    .daily-tag { font-size: 0.7rem; color: var(--muted); margin-left: 0.35rem; }
    .block-range { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; opacity: 0.6; margin-top: 0.12rem; }
    .gap {
      position: relative;
      margin-bottom: 0.3rem;
      border: 1px dashed rgba(224,168,74,0.45);
      border-radius: 10px;
      background: rgba(224,168,74,0.06);
      color: var(--wick);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45rem 0.75rem;
      font-size: 0.75rem;
      width: 100%;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .gap.armed { outline: 2px solid var(--wick); }
    .gap .cta { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.65rem; }

    .trays {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
      display: flex; flex-direction: column;
    }
    .tray {
      background: #0e121a;
      border-top: 1px solid rgba(224,168,74,0.25);
      padding: 0.55rem 1rem 0.85rem;
    }
    .tray-label {
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.35rem;
    }
    .tray.empty { color: var(--muted); font-size: 0.78rem; }
    .tray-chips { display: flex; gap: 0.4rem; overflow-x: auto; }
    .flex-chip {
      flex: 0 0 auto;
      background: var(--flex-bg);
      color: var(--flex);
      border: 1px solid rgba(224,184,150,0.55);
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 9.5rem;
      text-align: left;
    }
    .flex-chip.armed { outline: 2px solid var(--wick); }
    .flex-chip .name { font-weight: 600; display: block; }
    .flex-chip .meta { font-family: "IBM Plex Mono", monospace; font-size: 0.65rem; opacity: 0.75; }
    .flex-chip .ops { display: flex; gap: 0.25rem; margin-top: 0.25rem; }
    .flex-chip .ops button {
      background: transparent; border: 1px solid rgba(224,184,150,0.35);
      color: inherit; border-radius: 999px; font-size: 0.62rem;
      padding: 0.1rem 0.4rem; cursor: pointer;
    }
    .todo-chip {
      flex: 0 0 auto;
      background: var(--todo-bg);
      color: var(--todo);
      border: 1px solid rgba(201,142,200,0.55);
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 9.5rem;
      text-align: left;
    }
    .todo-chip .name { font-weight: 600; display: block; }
    .todo-chip .note { font-size: 0.68rem; opacity: 0.75; white-space: pre-line; margin-top: 0.15rem; }
    .todo-chip .ops { display: flex; gap: 0.25rem; margin-top: 0.25rem; }
    .todo-chip .ops button {
      background: transparent; border: 1px solid rgba(201,142,200,0.35);
      color: inherit; border-radius: 999px; font-size: 0.62rem;
      padding: 0.1rem 0.4rem; cursor: pointer;
    }
    .tray.todos { border-top-color: rgba(201,142,200,0.35); }

    .sheet-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 250;
      background: rgba(10, 12, 16, 0.55);
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: min(28rem, 100%);
      max-height: 85dvh;
      overflow: auto;
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px 16px 0 0;
      padding: 1.1rem 1.15rem 2.25rem;
      border-top: 1px solid rgba(224,168,74,0.28);
    }
    .sheet h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.85rem; }
    .sheet label { display: block; font-size: 0.75rem; font-weight: 600; margin: 0.65rem 0 0.25rem; }
    .sheet input, .sheet select, .sheet textarea {
      width: 100%;
      font: 400 1rem/1.3 "IBM Plex Sans", system-ui, sans-serif;
      padding: 0.5rem 0.6rem;
      border: 1px solid rgba(224,168,74,0.28);
      border-radius: 8px;
      background: #12161f;
      color: var(--ink);
    }
    .sheet .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    #promote-start-label[hidden] ~ #duration-label { grid-column: 1 / -1; }
    [hidden], .sheet [hidden] { display: none !important; }
    .sheet .actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .sheet button {
      font: 600 0.88rem/1 "IBM Plex Sans", system-ui, sans-serif;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .sheet .primary { background: var(--wick); color: #12161f; }
    .sheet .ghost { background: transparent; border: 1px solid rgba(224,168,74,0.28); color: var(--ink); }
    .sheet .choice-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0.4rem 0 0.8rem; }
    .sheet .choice-row button {
      background: transparent; border: 1px solid rgba(224,168,74,0.35); color: var(--ink);
    }
    .sheet .hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; }
    .sheet .danger { background: var(--danger); color: #fff; margin-left: auto; }
    .sheet .timing-field { transition: opacity 120ms ease; }
    .sheet .timing-field.is-authoritative input { border-color: var(--wick); box-shadow: 0 0 0 1px rgba(224,168,74,0.35); }
    .sheet .timing-field.is-derived { opacity: 0.55; }
    .sheet .field-error { font-size: 0.8rem; color: var(--danger); margin-bottom: 0.6rem; }
    #template-editor {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding: 0.9rem 1.1rem;
      background: var(--paper);
      border: 1px solid rgba(224,168,74,0.3);
      border-radius: 12px;
    }
    #template-editor[hidden] { display: none; }
    .template-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .template-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .template-fields label {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
    }
    .template-fields input, .template-fields select {
      padding: 0.5rem 0.65rem;
      font: inherit;
      border: 1px solid rgba(224,168,74,0.28);
      border-radius: 8px;
      background: #12161f;
      color: var(--ink);
    }
    .template-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }
    .template-actions button {
      font: 600 0.95rem/1.2 "IBM Plex Sans", system-ui, sans-serif;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.15s ease;
    }
    .template-actions button.primary, .template-btn-save {
      background: var(--wick);
      color: #12161f;
      border: 1px solid var(--wick);
      font-weight: 700;
    }
    .template-actions button.ghost, .template-btn {
      background: rgba(224,168,74,0.08);
      color: var(--ink);
      border: 1px solid rgba(224,168,74,0.32);
    }
    .template-actions button.ghost:hover {
      background: rgba(224,168,74,0.18);
    }
    #template-editor [role="status"] {
      color: var(--anchor);
      font-weight: 600;
      font-size: 0.85rem;
    }

    body.template-mode .stamps {
      grid-template-columns: 1fr 1fr;
    }
    body.template-mode #stamp-draft,
    body.template-mode #stamp-todo {
      display: none !important;
    }

    .block.anchor.overlap {
      border: 2px dashed var(--danger) !important;
      box-shadow: 0 0 8px rgba(224, 74, 74, 0.4);
      position: relative;
    }
    .block.anchor.overlap::after {
      content: "⚠️ Overlap";
      position: absolute;
      top: 0.35rem;
      right: 0.5rem;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--danger);
      background: rgba(224, 74, 74, 0.15);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
    }

    .toast {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(90vw, 26rem);
      width: max-content;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--wick);
      border-left: 4px solid var(--wick);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      cursor: pointer;
      animation: toastSlideIn 0.25s ease-out;
    }

    .toast[hidden] {
      display: none !important;
    }

    @keyframes toastSlideIn {
      from {
        transform: translateX(-50%) translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="kicker">Tonight’s Session</div>
      <p class="plan-date" id="plan-date"></p>
      <div class="weather" id="weather"></div>
      <div class="chrome">
        <button type="button" id="undo" disabled>Undo</button>
        <button type="button" id="redo" disabled>Redo</button>
        <button type="button" id="reset">Reset</button>
        <button type="button" class="primary" id="submit">Submit</button>
      </div>
    </header>

    <form id="template-editor" hidden data-mode="template">
      <div class="template-header-row">
        <strong id="template-mode-label">Reusable Day Template</strong>
        <span id="template-saved" role="status"></span>
      </div>
      <div class="template-fields">
        <label>Template name <input name="name" required></label>
        <label>Weekday <select name="weekday">
          <option value="">No weekday</option>
          <option>monday</option><option>tuesday</option><option>wednesday</option>
          <option>thursday</option><option>friday</option><option>saturday</option>
          <option>sunday</option>
        </select></label>
      </div>
      <div class="template-actions">
        <button type="submit" class="primary template-btn-save">Save Template</button>
        <button type="button" class="ghost template-btn" id="template-reset">Reset changes</button>
        <button type="button" class="ghost template-btn" id="template-back">Back to Library</button>
      </div>
    </form>

    <div class="template-offer" id="template-offer" hidden>
      <p>Use this weekday's Template?</p>
      <div class="actions">
        <button type="button" class="primary" id="template-yes">Yes</button>
        <button type="button" class="ghost" id="template-no">No</button>
      </div>
    </div>

    <div class="stamps">
      <button type="button" class="stamp anchor" id="stamp-anchor"><span>A</span>Anchor</button>
      <button type="button" class="stamp flex" id="stamp-flex"><span>F</span>Flex</button>
      <button type="button" class="stamp draft" id="stamp-draft"><span>D</span>Draft</button>
      <button type="button" class="stamp todo" id="stamp-todo"><span>T</span>To-do</button>
    </div>

    <div class="drafts empty" id="drafts"></div>

    <div class="blockers" id="blockers" role="alert" hidden></div>

    <button type="button" class="rail-cap" id="wake-cap">↑ wake</button>
    <div class="rail-wrap" id="rail"></div>
    <button type="button" class="rail-cap" id="sleep-cap">sleep ↓</button>
  </div>

  <div class="trays">
    <div class="tray todos empty" id="todos-tray">
      <div class="tray-label">To-dos — sometime tomorrow, no time needed</div>
      <div>No To-dos.</div>
    </div>
    <div class="tray empty" id="tray">
      <div class="tray-label">Unplaced Flex — Place / Change Duration / Drop any time</div>
      <div>No unplaced Flex.</div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <div class="sheet" id="sheet"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/static/session-page.js"></script>
</body>
</html>
