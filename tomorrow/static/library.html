<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #12161f;
      color: #e6e1d4;
      font-family: system-ui, sans-serif;
    }
    .shell { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1.1rem 4rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; }
    h2 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; color: #e0a84a; }
    section { border: 1px solid #2a3142; border-radius: 0.5rem; padding: 0.8rem; margin-bottom: 1rem; }
    .entry { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid #232a3a; gap: 0.5rem; }
    .entry:last-child { border-bottom: none; }
    .entry .meta { font-size: 0.8rem; color: #8b93a7; }
    .entry .actions { display: flex; gap: 0.4rem; }
    button { background: #1a2030; color: #e6e1d4; border: 1px solid #2a3142; border-radius: 0.35rem; padding: 0.3rem 0.6rem; cursor: pointer; }
    button.danger { color: #e07a6a; }
    form { display: grid; gap: 0.4rem; margin-top: 0.6rem; }
    input, select, textarea { background: #1a2030; color: #e6e1d4; border: 1px solid #2a3142; border-radius: 0.35rem; padding: 0.4rem; font-family: inherit; }
    textarea { min-height: 4.5rem; resize: vertical; }
    .hint { font-size: 0.75rem; color: #8b93a7; }
    .row-list { display: grid; gap: 0.5rem; }
    .entry-row { border: 1px solid #2a3142; border-radius: 0.4rem; padding: 0.5rem; display: grid; gap: 0.35rem; }
    .entry-row-header { display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; }
    .entry-row-fields { display: grid; gap: 0.35rem; }
    .entry-row-fields[hidden], .entry-row-fields .field[hidden] { display: none; }
    .bound-toggle { display: flex; gap: 0.6rem; align-items: center; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="shell">
    <h1>Library</h1>
    <p class="hint">Checklists, Day Templates, and Activity Templates live here. This page is separate from tonight's Session.</p>

    <section>
      <h2>Checklists</h2>
      <div id="checklist-list"></div>
      <form id="checklist-form">
        <input name="name" placeholder="Name" required>
        <span class="hint">Items, one per line</span>
        <textarea name="items" placeholder="Towel&#10;Lock"></textarea>
        <button type="submit">Save Checklist</button>
        <button type="button" id="checklist-cancel-edit" hidden>Cancel edit</button>
      </form>
    </section>

    <section>
      <h2>Activity Templates</h2>
      <div id="activity-list"></div>
      <form id="activity-form">
        <input name="name" placeholder="Name" required>
        <input name="duration_minutes" id="activity-duration" type="number" placeholder="Duration (minutes)">
        <input name="start" id="activity-start" placeholder="Start HH:MM (leave blank for Flex)">
        <div id="activity-bound-toggle" class="bound-toggle" hidden>
          <label><input type="radio" name="activity-bound-kind" value="duration" checked> Duration</label>
          <label><input type="radio" name="activity-bound-kind" value="end"> End</label>
          <input name="end" id="activity-end" placeholder="End HH:MM" hidden>
        </div>
        <select name="checklist" id="activity-checklist"></select>
        <label><input type="checkbox" name="daily" id="activity-daily"> Daily</label>
        <button type="submit">Save Activity Template</button>
        <button type="button" id="activity-cancel-edit" hidden>Cancel edit</button>
      </form>
    </section>

    <section>
      <h2>Day Templates</h2>
      <div id="day-template-list"></div>
      <form id="day-template-form">
        <input name="name" placeholder="Name" required>
        <select name="weekday" id="day-template-weekday"></select>
        <span class="hint">Entries</span>
        <div id="day-template-entries" class="row-list"></div>
        <button type="button" id="day-template-add-entry">+ Add entry</button>
        <button type="submit">Save Day Template</button>
        <button type="button" id="day-template-cancel-edit" hidden>Cancel edit</button>
      </form>
    </section>
  </div>

  <script>
    async function api(path, options) {
      const response = await fetch(path, options);
      return response.json();
    }

    const WEEKDAYS = [
      "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday",
    ];

    let currentActivityOptions = [];
    let currentChecklistOptions = [];
    let currentDayTemplateOptions = [];

    function renderList(el, entries, kind, onEdit) {
      el.innerHTML = "";
      for (const entry of entries) {
        const row = document.createElement("div");
        row.className = "entry";
        const label = document.createElement("span");
        label.textContent = entry.name;
        const actions = document.createElement("div");
        actions.className = "actions";
        if (onEdit) {
          const edit = document.createElement("button");
          edit.textContent = "Edit";
          edit.onclick = () => onEdit(entry);
          actions.appendChild(edit);
        }
        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Delete";
        del.onclick = async () => {
          await api("/api/library/" + kind, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", id: entry.id }),
          });
          load();
        };
        actions.appendChild(del);
        row.appendChild(label);
        row.appendChild(actions);
        el.appendChild(row);
      }
    }

    async function load() {
      const data = await api("/api/library");
      currentActivityOptions = data.activity_templates;
      currentChecklistOptions = data.checklists;
      currentDayTemplateOptions = data.day_templates;
      renderList(document.getElementById("checklist-list"), data.checklists, "checklist", editChecklist);
      renderList(document.getElementById("activity-list"), data.activity_templates, "activity-template", editActivityTemplate);
      renderList(
        document.getElementById("day-template-list"),
        data.day_templates,
        "day-template",
        editDayTemplate
      );
      renderWeekdayOptions();
      if (editingActivityId === null) {
        renderChecklistOptions("");
      }
    }

    // --- Checklists -----------------------------------------------------

    const checklistForm = document.getElementById("checklist-form");
    const checklistCancelEdit = document.getElementById("checklist-cancel-edit");
    let editingChecklistId = null;

    function resetChecklistForm() {
      checklistForm.reset();
      editingChecklistId = null;
      checklistCancelEdit.hidden = true;
    }

    function editChecklist(entry) {
      editingChecklistId = entry.id;
      checklistForm.elements.name.value = entry.name;
      checklistForm.elements.items.value = (entry.items || []).join("\n");
      checklistCancelEdit.hidden = false;
      checklistForm.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    checklistCancelEdit.addEventListener("click", resetChecklistForm);

    checklistForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const items = String(form.get("items") || "")
        .split("\n")
        .map((item) => item.trim())
        .filter(Boolean);
      const result = await api("/api/library/checklist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "save",
          id: editingChecklistId,
          name: form.get("name"),
          items,
        }),
      });
      if (result && result.error) {
        alert(result.error);
        return;
      }
      resetChecklistForm();
      load();
    });

    // --- Activity Templates -----------------------------------------------

    const activityForm = document.getElementById("activity-form");
    const activityCancelEdit = document.getElementById("activity-cancel-edit");
    const activityStartInput = document.getElementById("activity-start");
    const activityEndInput = document.getElementById("activity-end");
    const activityDurationInput = document.getElementById("activity-duration");
    const activityDailyInput = document.getElementById("activity-daily");
    const activityBoundToggle = document.getElementById("activity-bound-toggle");
    const activityChecklistSelect = document.getElementById("activity-checklist");
    let editingActivityId = null;

    function renderChecklistOptions(selected) {
      let html = '<option value="">-- none --</option>';
      for (const option of currentChecklistOptions) {
        const isSelected = option.id === selected ? " selected" : "";
        html += `<option value="${option.id}"${isSelected}>${option.name}</option>`;
      }
      activityChecklistSelect.innerHTML = html;
    }

    function applyActivityBoundKind() {
      const kind = activityForm.elements["activity-bound-kind"].value;
      activityEndInput.hidden = kind !== "end";
      activityDurationInput.hidden = kind !== "duration";
    }

    for (const radio of activityForm.elements["activity-bound-kind"]) {
      radio.addEventListener("change", applyActivityBoundKind);
    }

    function applyActivityShape() {
      const hasStart = activityStartInput.value.trim().length > 0;
      activityBoundToggle.hidden = !hasStart;
      if (hasStart) {
        activityDailyInput.checked = false;
        activityDailyInput.disabled = true;
        applyActivityBoundKind();
      } else {
        activityDailyInput.disabled = false;
        activityEndInput.hidden = true;
        activityDurationInput.hidden = false;
      }
    }
    activityStartInput.addEventListener("input", applyActivityShape);

    function resetActivityForm() {
      activityForm.reset();
      editingActivityId = null;
      activityCancelEdit.hidden = true;
      activityDailyInput.disabled = false;
      applyActivityShape();
    }

    function editActivityTemplate(entry) {
      editingActivityId = entry.id;
      activityForm.elements.name.value = entry.name;
      activityForm.elements.start.value = entry.start || "";
      activityForm.elements.daily.checked = !!entry.daily;
      renderChecklistOptions(entry.checklist || "");
      if (entry.is_anchor_shaped && entry.end != null) {
        activityForm.elements["activity-bound-kind"].value = "end";
        activityEndInput.value = entry.end;
        activityDurationInput.value = "";
      } else {
        activityForm.elements["activity-bound-kind"].value = "duration";
        activityDurationInput.value = entry.duration_minutes != null ? entry.duration_minutes : "";
        activityEndInput.value = "";
      }
      applyActivityShape();
      activityCancelEdit.hidden = false;
      activityForm.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    activityCancelEdit.addEventListener("click", resetActivityForm);

    activityForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const start = form.get("start") || null;
      const daily = form.get("daily") === "on";
      if (daily && start) {
        alert("A Daily Activity cannot have a fixed start.");
        return;
      }
      const boundKind = start ? form.get("activity-bound-kind") : "duration";
      const durationMinutes = boundKind === "duration" && form.get("duration_minutes")
        ? Number(form.get("duration_minutes"))
        : null;
      const end = boundKind === "end" ? (form.get("end") || null) : null;
      const result = await api("/api/library/activity-template", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "save",
          id: editingActivityId,
          name: form.get("name"),
          duration_minutes: durationMinutes,
          start,
          end,
          checklist: form.get("checklist") || null,
          daily,
        }),
      });
      if (result && result.error) {
        alert(result.error);
        return;
      }
      resetActivityForm();
      load();
    });

    // --- Day Templates ------------------------------------------------------

    function weekdayOwnerLabel(weekday, excludingId) {
      const owner = currentDayTemplateOptions.find(
        (template) => template.weekday === weekday && template.id !== excludingId
      );
      return owner ? `${weekday} (currently ${owner.name})` : weekday;
    }

    function renderWeekdayOptions(selected, excludingId) {
      const select = document.getElementById("day-template-weekday");
      let html = '<option value="">-- none --</option>';
      for (const weekday of WEEKDAYS) {
        const isSelected = weekday === selected ? " selected" : "";
        html += `<option value="${weekday}"${isSelected}>${weekdayOwnerLabel(weekday, excludingId)}</option>`;
      }
      select.innerHTML = html;
    }

    function optionsHtml(options, selected) {
      let html = '<option value="">-- none --</option>';
      for (const option of options) {
        const isSelected = option.id === selected ? " selected" : "";
        html += `<option value="${option.id}"${isSelected}>${option.name}</option>`;
      }
      return html;
    }

    function buildEntryRow(entry) {
      entry = entry || {};
      const isActivityRef = entry.activity != null;
      const isFlex = !isActivityRef && entry.start == null;
      const type = isActivityRef ? "activity" : isFlex ? "flex" : "anchor";
      const hasEnd = !isActivityRef && !isFlex && entry.end != null;

      const boundGroupName = "entry-bound-kind-" + Math.random().toString(36).slice(2);

      const row = document.createElement("div");
      row.className = "entry-row";
      row.innerHTML = `
        <div class="entry-row-header">
          <select class="entry-type">
            <option value="anchor">Anchor (fixed start)</option>
            <option value="flex">Flex (duration only)</option>
            <option value="activity">Activity Template reference</option>
          </select>
          <button type="button" class="danger remove-entry-row">Remove</button>
        </div>
        <div class="entry-row-fields inline-fields">
          <input class="entry-name" placeholder="Name" value="${entry.name || ""}">
          <input class="entry-start" placeholder="Start HH:MM (Anchor only)" value="${entry.start || ""}">
          <div class="bound-toggle entry-bound-toggle">
            <label><input type="radio" name="${boundGroupName}" class="entry-bound-duration-radio" checked> Duration</label>
            <label><input type="radio" name="${boundGroupName}" class="entry-bound-end-radio"> End</label>
          </div>
          <input class="entry-duration" type="number" placeholder="Duration (minutes)" value="${entry.duration != null ? entry.duration : ""}">
          <input class="entry-end" placeholder="End HH:MM" value="${entry.end || ""}" hidden>
          <select class="entry-checklist"></select>
        </div>
        <div class="entry-row-fields activity-fields" hidden>
          <select class="entry-activity"></select>
        </div>
      `;
      row.querySelector(".entry-type").value = type;
      row.querySelector(".entry-checklist").innerHTML = optionsHtml(
        currentChecklistOptions,
        entry.checklist || ""
      );
      row.querySelector(".entry-activity").innerHTML = optionsHtml(
        currentActivityOptions,
        entry.activity || ""
      );

      const durationRadio = row.querySelector(".entry-bound-duration-radio");
      const endRadio = row.querySelector(".entry-bound-end-radio");
      const durationInput = row.querySelector(".entry-duration");
      const endInput = row.querySelector(".entry-end");
      if (hasEnd) {
        endRadio.checked = true;
      } else {
        durationRadio.checked = true;
      }

      const startField = row.querySelector(".entry-start");
      const boundToggle = row.querySelector(".entry-bound-toggle");
      const inlineFields = row.querySelector(".inline-fields");
      const activityFields = row.querySelector(".activity-fields");

      function applyBoundKind() {
        const useEnd = endRadio.checked;
        endInput.hidden = !useEnd;
        durationInput.hidden = useEnd;
      }
      durationRadio.addEventListener("change", applyBoundKind);
      endRadio.addEventListener("change", applyBoundKind);

      function applyType() {
        const value = row.querySelector(".entry-type").value;
        activityFields.hidden = value !== "activity";
        inlineFields.hidden = value === "activity";
        startField.hidden = value === "flex";
        boundToggle.hidden = value !== "anchor";
        if (value === "flex") {
          durationInput.hidden = false;
          endInput.hidden = true;
        } else {
          applyBoundKind();
        }
      }
      row.querySelector(".entry-type").addEventListener("change", applyType);
      applyType();

      row.querySelector(".remove-entry-row").onclick = () => row.remove();
      return row;
    }

    function entryRowsToPayload(container) {
      const anchors = [];
      const flexes = [];
      for (const row of container.children) {
        const type = row.querySelector(".entry-type").value;
        if (type === "activity") {
          const activityId = row.querySelector(".entry-activity").value;
          if (!activityId) continue;
          const activity = currentActivityOptions.find((option) => option.id === activityId);
          if (activity && activity.is_anchor_shaped) {
            anchors.push({ activity: activityId });
          } else {
            flexes.push({ activity: activityId });
          }
          continue;
        }
        const name = row.querySelector(".entry-name").value.trim();
        if (!name) continue;
        const checklist = row.querySelector(".entry-checklist").value || null;
        if (type === "anchor") {
          const start = row.querySelector(".entry-start").value.trim();
          if (!start) continue;
          const useEnd = row.querySelector(".entry-bound-end-radio").checked;
          if (useEnd) {
            const end = row.querySelector(".entry-end").value.trim();
            if (!end) continue;
            anchors.push({ name, start, end, checklist });
          } else {
            const duration = Number(row.querySelector(".entry-duration").value);
            if (!Number.isFinite(duration) || duration <= 0) continue;
            anchors.push({ name, start, duration, checklist });
          }
        } else {
          const duration = Number(row.querySelector(".entry-duration").value);
          if (!Number.isFinite(duration) || duration <= 0) continue;
          flexes.push({ name, duration, checklist });
        }
      }
      return { anchors, flexes };
    }

    const dayTemplateForm = document.getElementById("day-template-form");
    const dayTemplateEntries = document.getElementById("day-template-entries");
    const dayTemplateCancelEdit = document.getElementById("day-template-cancel-edit");
    let editingDayTemplateId = null;

    document.getElementById("day-template-add-entry").addEventListener("click", () => {
      dayTemplateEntries.appendChild(buildEntryRow());
    });

    function resetDayTemplateForm() {
      dayTemplateForm.reset();
      dayTemplateEntries.innerHTML = "";
      editingDayTemplateId = null;
      dayTemplateCancelEdit.hidden = true;
      renderWeekdayOptions();
    }

    function editDayTemplate(entry) {
      editingDayTemplateId = entry.id;
      dayTemplateForm.elements.name.value = entry.name;
      renderWeekdayOptions(entry.weekday || "", entry.id);
      dayTemplateEntries.innerHTML = "";
      for (const anchor of entry.anchors || []) {
        dayTemplateEntries.appendChild(buildEntryRow(anchor));
      }
      for (const flex of entry.flexes || []) {
        dayTemplateEntries.appendChild(buildEntryRow(flex));
      }
      dayTemplateCancelEdit.hidden = false;
      dayTemplateForm.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    dayTemplateCancelEdit.addEventListener("click", resetDayTemplateForm);

    dayTemplateForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const { anchors, flexes } = entryRowsToPayload(dayTemplateEntries);
      const result = await api("/api/library/day-template", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "save",
          id: editingDayTemplateId,
          name: form.get("name"),
          weekday: form.get("weekday") || null,
          anchors,
          flexes,
        }),
      });
      if (result && result.error) {
        alert(result.error);
        return;
      }
      resetDayTemplateForm();
      load();
    });

    applyActivityShape();
    load();
  </script>
</body>
</html>
