<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #12161f;
      color: #e6e1d4;
      font-family: system-ui, sans-serif;
    }
    .shell { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1.1rem 4rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; }
    h2 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; color: #e0a84a; }
    section { border: 1px solid #2a3142; border-radius: 0.5rem; padding: 0.8rem; margin-bottom: 1rem; }
    .entry { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid #232a3a; gap: 0.5rem; }
    .entry:last-child { border-bottom: none; }
    .entry .meta { font-size: 0.8rem; color: #8b93a7; }
    .entry .actions { display: flex; gap: 0.4rem; }
    .day-template-entry { cursor: grab; }
    .day-template-entry.dragging { opacity: 0.45; }
    .day-template-entry.drop-target { border-top: 2px solid #e0a84a; }
    #day-template-order-status { min-height: 1em; margin-top: 0.4rem; }
    button { background: #1a2030; color: #e6e1d4; border: 1px solid #2a3142; border-radius: 0.35rem; padding: 0.3rem 0.6rem; cursor: pointer; }
    button.danger { color: #e07a6a; }
    form { display: grid; gap: 0.4rem; margin-top: 0.6rem; }
    input, select, textarea { background: #1a2030; color: #e6e1d4; border: 1px solid #2a3142; border-radius: 0.35rem; padding: 0.4rem; font-family: inherit; }
    textarea { min-height: 4.5rem; resize: vertical; }
    .hint { font-size: 0.75rem; color: #8b93a7; }
    .row-list { display: grid; gap: 0.5rem; }
    .entry-row { border: 1px solid #2a3142; border-radius: 0.4rem; padding: 0.5rem; display: grid; gap: 0.35rem; }
    .entry-row-header { display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; }
    .entry-row-fields { display: grid; gap: 0.35rem; }
    .entry-row-fields[hidden], .entry-row-fields .field[hidden] { display: none; }
    .bound-toggle { display: flex; gap: 0.6rem; align-items: center; font-size: 0.85rem; }
    .timing-derived { opacity: 0.55; }
    .timing-authoritative { border-color: #e0a84a !important; box-shadow: 0 0 0 1px rgba(224,168,74,0.35); }
    .field-error { color: #e07a6a; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="shell">
    <h1>Library</h1>
    <p class="hint">Checklists, Day Templates, and Activity Templates live here. This page is separate from tonight's Session.</p>

    <section>
      <h2>Checklists</h2>
      <div id="checklist-list"></div>
      <form id="checklist-form">
        <input name="name" placeholder="Name" required>
        <span class="hint">Items, one per line</span>
        <textarea name="items" placeholder="Towel&#10;Lock"></textarea>
        <button type="submit">Save Checklist</button>
        <button type="button" id="checklist-cancel-edit" hidden>Cancel edit</button>
      </form>
    </section>

    <section>
      <h2>Activity Templates</h2>
      <div id="activity-list"></div>
      <form id="activity-form">
        <input name="name" placeholder="Name" required>
        <input name="duration_minutes" id="activity-duration" type="number" placeholder="Duration (minutes)">
        <input name="start" id="activity-start" placeholder="Start HH:MM (leave blank for Flex)">
        <label id="activity-end-label">End <input name="end" id="activity-end" type="time"></label>
        <p id="activity-timing-error" class="field-error" hidden>End must be later than Start.</p>
        <select name="checklist" id="activity-checklist"></select>
        <label><input type="checkbox" name="daily" id="activity-daily"> Daily</label>
        <button type="submit">Save Activity Template</button>
        <button type="button" id="activity-cancel-edit" hidden>Cancel edit</button>
      </form>
    </section>

    <section>
      <h2>Day Templates</h2>
      <div id="day-template-list"></div>
      <p id="day-template-order-status" class="hint" role="status" aria-live="polite">Drag templates to change their order.</p>
      <button type="button" id="day-template-new">New Day Template</button>
    </section>
  </div>

  <script>
    async function api(path, options) {
      const response = await fetch(path, options);
      return response.json();
    }

    const WEEKDAYS = [
      "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday",
    ];

    let currentActivityOptions = [];
    let currentChecklistOptions = [];
    let currentDayTemplateOptions = [];

    function renderList(el, entries, kind, onEdit) {
      el.innerHTML = "";
      for (const entry of entries) {
        const row = document.createElement("div");
        row.className = "entry";
        const label = document.createElement("span");
        label.textContent = entry.name;
        const actions = document.createElement("div");
        actions.className = "actions";
        if (onEdit) {
          const edit = document.createElement("button");
          edit.textContent = "Edit";
          edit.onclick = () => onEdit(entry);
          actions.appendChild(edit);
        }
        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Delete";
        del.onclick = async () => {
          await api("/api/library/" + kind, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", id: entry.id }),
          });
          load();
        };
        actions.appendChild(del);
        row.appendChild(label);
        row.appendChild(actions);
        el.appendChild(row);
      }
    }

    function renderDayTemplates(entries) {
      const el = document.getElementById("day-template-list");
      el.innerHTML = "";
      entries.forEach((entry, index) => {
        const row = document.createElement("div");
        row.className = "entry day-template-entry";
        row.draggable = true;
        row.dataset.id = entry.id;
        row.setAttribute("aria-label", `${entry.name}, position ${index + 1}. Drag to reorder.`);
        const handle = document.createElement("span");
        handle.textContent = "⠿ " + entry.name;
        handle.title = "Drag to reorder";
        const actions = document.createElement("div");
        actions.className = "actions";
        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.onclick = () => editDayTemplate(entry);
        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Delete";
        del.onclick = async () => {
          await api("/api/library/day-template", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", id: entry.id }),
          });
          load();
        };
        actions.append(edit, del);
        row.append(handle, actions);
        row.addEventListener("dragstart", (event) => {
          row.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", entry.id);
        });
        row.addEventListener("dragend", () => {
          row.classList.remove("dragging");
          el.querySelectorAll(".drop-target").forEach((item) => item.classList.remove("drop-target"));
        });
        row.addEventListener("dragover", (event) => {
          event.preventDefault();
          row.classList.add("drop-target");
        });
        row.addEventListener("dragleave", () => row.classList.remove("drop-target"));
        row.addEventListener("drop", async (event) => {
          event.preventDefault();
          row.classList.remove("drop-target");
          const draggedId = event.dataTransfer.getData("text/plain");
          if (!draggedId || draggedId === entry.id) return;
          const ids = entries.map((item) => item.id);
          const from = ids.indexOf(draggedId);
          const to = ids.indexOf(entry.id);
          if (from < 0 || to < 0) return;
          ids.splice(to, 0, ids.splice(from, 1)[0]);
          const result = await api("/api/library/day-template", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "reorder", ids }),
          });
          if (result && result.error) {
            document.getElementById("day-template-order-status").textContent = result.error;
          } else {
            document.getElementById("day-template-order-status").textContent = "Order saved.";
          }
          load();
        });
        el.appendChild(row);
      });
    }

    async function load() {
      const data = await api("/api/library");
      currentActivityOptions = data.activity_templates;
      currentChecklistOptions = data.checklists;
      currentDayTemplateOptions = data.day_templates;
      renderList(document.getElementById("checklist-list"), data.checklists, "checklist", editChecklist);
      renderList(document.getElementById("activity-list"), data.activity_templates, "activity-template", editActivityTemplate);
      renderDayTemplates(data.day_templates);
      renderWeekdayOptions();
      if (editingActivityId === null) {
        renderChecklistOptions("");
      }
    }

    // --- Checklists -----------------------------------------------------

    const checklistForm = document.getElementById("checklist-form");
    const checklistCancelEdit = document.getElementById("checklist-cancel-edit");
    let editingChecklistId = null;

    function resetChecklistForm() {
      checklistForm.reset();
      editingChecklistId = null;
      checklistCancelEdit.hidden = true;
    }

    function editChecklist(entry) {
      editingChecklistId = entry.id;
      checklistForm.elements.name.value = entry.name;
      checklistForm.elements.items.value = (entry.items || []).join("\n");
      checklistCancelEdit.hidden = false;
      checklistForm.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    checklistCancelEdit.addEventListener("click", resetChecklistForm);

    checklistForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const items = String(form.get("items") || "")
        .split("\n")
        .map((item) => item.trim())
        .filter(Boolean);
      const result = await api("/api/library/checklist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "save",
          id: editingChecklistId,
          name: form.get("name"),
          items,
        }),
      });
      if (result && result.error) {
        alert(result.error);
        return;
      }
      resetChecklistForm();
      load();
    });

    // --- Activity Templates -----------------------------------------------

    const activityForm = document.getElementById("activity-form");
    const activityCancelEdit = document.getElementById("activity-cancel-edit");
    const activityStartInput = document.getElementById("activity-start");
    const activityEndInput = document.getElementById("activity-end");
    const activityDurationInput = document.getElementById("activity-duration");
    const activityDailyInput = document.getElementById("activity-daily");
    const activityChecklistSelect = document.getElementById("activity-checklist");
    let editingActivityId = null;

    function renderChecklistOptions(selected) {
      let html = '<option value="">-- none --</option>';
      for (const option of currentChecklistOptions) {
        const isSelected = option.id === selected ? " selected" : "";
        html += `<option value="${option.id}"${isSelected}>${option.name}</option>`;
      }
      activityChecklistSelect.innerHTML = html;
    }

    let activityTimingAuthority = "duration";

    function updateActivityCounterpart() {
      const start = activityStartInput.value;
      const endIsActive = Boolean(start) && activityTimingAuthority === "end";
      activityDurationInput.required = !endIsActive;
      activityEndInput.required = endIsActive;
      activityDurationInput.classList.toggle("timing-derived", activityTimingAuthority === "end");
      activityDurationInput.classList.toggle("timing-authoritative", activityTimingAuthority !== "end");
      activityEndInput.classList.toggle("timing-derived", activityTimingAuthority !== "end");
      activityEndInput.classList.toggle("timing-authoritative", activityTimingAuthority === "end");
      if (!start) return;
      if (activityTimingAuthority === "end") {
        if (!activityEndInput.value) return;
        const [sh, sm] = start.split(":").map(Number);
        const [eh, em] = activityEndInput.value.split(":").map(Number);
        const duration = (eh * 60 + em - (sh * 60 + sm) + 1440) % 1440;
        if (duration > 0) activityDurationInput.value = duration;
      } else {
        const duration = Number(activityDurationInput.value);
        if (duration > 0) {
          const [hours, minutes] = start.split(":").map(Number);
          const end = (hours * 60 + minutes + duration) % 1440;
          activityEndInput.value = String(Math.floor(end / 60)).padStart(2, "0") + ":" + String(end % 60).padStart(2, "0");
        }
      }
    }

    function applyActivityShape() {
      const hasStart = activityStartInput.value.trim().length > 0;
      if (hasStart) {
        activityDailyInput.checked = false;
        activityDailyInput.disabled = true;
      } else {
        activityDailyInput.disabled = false;
        activityEndInput.value = "";
      }
      document.getElementById("activity-end-label").hidden = !hasStart;
      updateActivityCounterpart();
    }
    activityStartInput.addEventListener("input", applyActivityShape);
    activityDurationInput.addEventListener("input", () => { activityTimingAuthority = "duration"; updateActivityCounterpart(); });
    activityEndInput.addEventListener("input", () => {
      activityTimingAuthority = "end";
      document.getElementById("activity-timing-error").hidden = true;
      updateActivityCounterpart();
    });
    activityStartInput.addEventListener("input", () => { document.getElementById("activity-timing-error").hidden = true; });

    function resetActivityForm() {
      activityForm.reset();
      editingActivityId = null;
      activityCancelEdit.hidden = true;
      activityDailyInput.disabled = false;
      activityTimingAuthority = "duration";
      document.getElementById("activity-timing-error").hidden = true;
      applyActivityShape();
    }

    function editActivityTemplate(entry) {
      editingActivityId = entry.id;
      activityForm.elements.name.value = entry.name;
      activityForm.elements.start.value = entry.start || "";
      activityForm.elements.daily.checked = !!entry.daily;
      renderChecklistOptions(entry.checklist || "");
      activityTimingAuthority = entry.is_anchor_shaped && entry.end != null ? "end" : "duration";
      activityDurationInput.value = entry.duration_minutes != null ? entry.duration_minutes : "";
      activityEndInput.value = entry.end || "";
      applyActivityShape();
      activityCancelEdit.hidden = false;
      activityForm.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    activityCancelEdit.addEventListener("click", resetActivityForm);

    activityForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const start = form.get("start") || null;
      const daily = form.get("daily") === "on";
      if (daily && start) {
        alert("A Daily Activity cannot have a fixed start.");
        return;
      }
      const boundKind = start ? activityTimingAuthority : "duration";
      const durationMinutes = boundKind === "duration" && form.get("duration_minutes")
        ? Number(form.get("duration_minutes"))
        : null;
      const end = boundKind === "end" ? (form.get("end") || null) : null;
      if (start && boundKind === "end" && (!end || end === start)) {
        document.getElementById("activity-timing-error").hidden = false;
        activityEndInput.focus();
        return;
      }
      if (!durationMinutes && !end) {
        document.getElementById("activity-timing-error").textContent = "Enter a positive duration or a valid end time.";
        document.getElementById("activity-timing-error").hidden = false;
        return;
      }
      const result = await api("/api/library/activity-template", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "save",
          id: editingActivityId,
          name: form.get("name"),
          duration_minutes: durationMinutes,
          start,
          end,
          checklist: form.get("checklist") || null,
          daily,
        }),
      });
      if (result && result.error) {
        alert(result.error);
        return;
      }
      resetActivityForm();
      load();
    });

    // Day Templates use the shared timeline planner; this page only navigates.
    function editDayTemplate(entry) {
      window.location.href = "/?template=" + encodeURIComponent(entry.id);
    }

    document.getElementById("day-template-new").addEventListener("click", () => {
      window.location.href = "/?template=" + encodeURIComponent("new");
    });

    applyActivityShape();
    load();
  </script>
</body>
</html>
