[project]
name = "tomorrow"
version = "0.1.0"
description = "Night-before personal Plan wizard"
readme = "CONTEXT.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
]

[project.scripts]
tomorrow = "tomorrow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tomorrow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
